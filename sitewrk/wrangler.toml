name = "m365-dub-site"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = false

# Vor GitHub Pages: nur aktiv, wenn dub.m365.fm in Cloudflare auf "Proxied" (orange Wolke) steht.
routes = [{ pattern = "dub.m365.fm/*", zone_name = "m365.fm" }, { pattern = "www.m365.fm/*", zone_name = "m365.fm" }, { pattern = "m365.fm/*", zone_name = "m365.fm" },
  { pattern = "img.m365.fm/pages/*", zone_name = "m365.fm" }, { pattern = "img.m365.fm/meta/*", zone_name = "m365.fm" }]   # Bucket-Interna auf img.m365.fm sperren (404), Bilder bleiben direkt aus R2
# Spaeter, wenn m365.fm von Podpage auf die Plattform umzieht (MIGRATED=1 setzen):
# routes = [{ pattern = "dub.m365.fm/*", zone_name = "m365.fm" }, { pattern = "www.m365.fm/*", zone_name = "m365.fm" }, { pattern = "m365.fm/*", zone_name = "m365.fm" }]

[vars]
ORIGIN = "https://www.m365.fm"
MIGRATED = "1"
# Hier aendern, nicht im Dashboard (wrangler deploy ueberschreibt Dashboard-Variablen).
# R2 als Ursprung: "1" = Seiten und Dateien zuerst aus dem Bucket (pages/<pfad>, Spiegel der Website aus dem Deploy-Job, tools/r2_site_sync.py),
# aber nur solange pages/r2-build.txt mit /r2-build.txt auf GitHub Pages uebereinstimmt - sonst automatisch GitHub Pages.
# "0" = wie bisher (GitHub Pages zuerst, R2 nur fuer Seiten, die es nur dort gibt). Notschalter: hier auf "0" setzen und mergen.
R2_PRIMARY = "0"

[[r2_buckets]]
binding = "PAGES"   # Seiten, die der Seitenbau nach R2 laedt (pages/<pfad>/index.html), statt in GitHub Pages
bucket_name = "m365-fm"

# ================================================================ Testumgebung (Staging) - STAGING.md
# Eigener Worker auf staging.m365.fm. Liefert NUR Seiten aus dem eigenen Bucket m365-fm-staging (pages/<pfad>), nie GitHub Pages und nie den Live-Bucket
# (sitewrk/index.js, stagingFetch). Alles noindex/nofollow, robots.txt sperrt alles. Deploy ausschliesslich ueber .github/workflows/site-staging.yml
# (wrangler deploy --env staging). routes und workers_dev stehen hier ausdruecklich, weil wrangler sie sonst vom Live-Teil erbt (dub.m365.fm, www.m365.fm).
# tools/check_staging_isolation.py verbietet hier jeden Live-Namen.
[env.staging]
name = "m365-dub-site-staging"
workers_dev = false
routes = [{ pattern = "staging.m365.fm", custom_domain = true, zone_name = "m365.fm" }]

[env.staging.vars]
ENVIRONMENT = "staging"
ORIGIN = "https://staging.m365.fm"
MIGRATED = "0"
R2_PRIMARY = "0"

[[env.staging.r2_buckets]]
binding = "PAGES"
bucket_name = "m365-fm-staging"

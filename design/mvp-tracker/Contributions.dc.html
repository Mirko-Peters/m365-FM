<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contributions log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#f3f3f2}
a{color:#3b6391}a:hover{color:#2c4b70}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3b6391;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f3f3f2; color: #17191c; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">

  <header style="flex: 0 0 auto; padding: 18px 20px 10px; display: grid; gap: 10px">
    <div style="display: grid">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; line-height: 1">Contributions</h1>
      <span style="font-size: 14px; color: #5d6470">Collected automatically from M365.FM, YouTube, your blog and GitHub</span>
    </div>
    <div role="group" aria-label="Filter" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #17191c">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <a href="Contribution-Detail.dc.html" style="display: grid; gap: 6px; padding: 12px 14px; background: #ffffff; border: 1px solid rgba(23,25,28,.14); text-decoration: none; color: #17191c">
        <span style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #3b6391">{{it.type}} · {{it.date}}</span>
          <span style="{{it.stStyle}}">{{it.st}}</span>
        </span>
        <b style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.12">{{it.title}}</b>
        <span style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
          <span style="font-size: 13px; color: #5d6470">{{it.src}}</span>
          <sc-for list="{{it.progs}}" as="p" hint-placeholder-count="2">
            <span style="padding: 0 6px; border: 1px solid rgba(23,25,28,.3); font: 600 11px/1.7 'Barlow Condensed', sans-serif; letter-spacing: .08em; text-transform: uppercase">{{p.n}}</span>
          </sc-for>
        </span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="App" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; border-top: 1px solid rgba(23,25,28,.14); background: #ffffff; padding-bottom: 10px">
    <a href="Main.dc.html" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; color: #5d6470; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10l8-6 8 6v9H3z"></path></svg>Home</a>
    <a href="Contributions.dc.html" aria-current="page" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; font-weight: 600; color: #3b6391; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h12M5 11h12M5 17h8"></path></svg>Log</a>
    <a href="Add.dc.html" aria-label="Add contribution" style="justify-self: center; width: 52px; height: 52px; margin-bottom: 6px; border-radius: 50%; background: #3b6391; color: #ffffff; display: grid; place-items: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4v14M4 11h14"></path></svg></a>
    <a href="Impact.dc.html" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; color: #5d6470; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 18V11M9 18V6M14 18v-9M19 18V3"></path></svg>Impact</a>
    <a href="Chances.dc.html" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; color: #5d6470; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"></circle><circle cx="11" cy="11" r="3"></circle></svg>Chances</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const f = s.f || 'open';
    const L = [
      { type: 'Podcast', date: '[DATE]', title: 'Copilot Studio governance – guest episode', src: 'Auto · M365.FM', progs: ['MVP'], open: true },
      { type: 'Speaker', date: '[DATE]', title: 'Azure Virtual Desktop in practice', src: 'Shared from LinkedIn', progs: ['MVP', 'NVP'], open: true },
      { type: 'Video', date: '[DATE]', title: 'Power Platform governance explained', src: 'Auto · YouTube', progs: ['MVP'], open: true },
      { type: 'Article', date: '[DATE]', title: 'SAP data in Microsoft Fabric', src: 'Auto · blog feed', progs: ['MVP', 'SAP'], open: true },
      { type: 'Training', date: '[DATE]', title: 'Copilot workshop for admins, 2 days', src: 'Added by hand', progs: ['MCT'], open: true },
      { type: 'Open source', date: '[DATE]', title: 'PnP script sample for site provisioning', src: 'Auto · GitHub', progs: ['MVP'], open: true, wait: 'Pull request open' },
      { type: 'Podcast', date: '[DATE]', title: 'Teams Phone migration', src: 'Auto · M365.FM', progs: ['MVP'], open: false },
      { type: 'Event', date: '[DATE]', title: 'Organized: M365Con 2027 session track', src: 'Auto · M365.FM events', progs: ['MVP'], open: false }
    ];
    const items = L.filter((i) => f === 'all' || (f === 'open' ? i.open : !i.open)).map((i) => Object.assign({}, i, {
      progs: i.progs.map((n) => ({ n })),
      st: i.wait ? i.wait + ' · wait' : i.open ? 'Not in portal' : 'Entered',
      stStyle: i.wait ? 'padding: 0 6px; border: 1px solid #9a4f0f; color: #9a4f0f; font: 600 11px/1.7 Barlow Condensed, sans-serif; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;' : i.open ? 'padding: 0 6px; background: #9a4f0f; color: #ffffff; font: 600 11px/1.7 Barlow Condensed, sans-serif; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;' : 'padding: 0 6px; background: #2f6b3a; color: #ffffff; font: 600 11px/1.7 Barlow Condensed, sans-serif; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;'
    }));
    const filters = [['open', 'Open · 6'], ['done', 'Entered'], ['all', 'All · 18']].map(([k, label]) => ({
      label, on: f === k,
      pick: () => this.setState({ f: k }),
      style: 'min-height: 44px; border: 0; border-radius: 0; cursor: pointer; font-family: Barlow Condensed, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; ' + (f === k ? 'background: #17191c; color: #ffffff;' : 'background: #ffffff; color: #17191c;')
    }));
    return { items, filters };
  }
}
</script>
</body>
</html>

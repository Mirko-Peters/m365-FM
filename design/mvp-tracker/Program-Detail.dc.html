<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Microsoft MVP – renewal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#f3f3f2}
a{color:#3b6391}a:hover{color:#2c4b70}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3b6391;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f3f3f2; color: #17191c; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">

  <header style="flex: 0 0 auto; display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgba(23,25,28,.14); background: #ffffff">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; color: #17191c; text-decoration: none; font-weight: 600"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 3L5 9l6 6"></path></svg>Programs</a>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; gap: 6px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; line-height: 1">{{name}}</h1>
      <span style="font-size: 15px; color: #5d6470">{{sub}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #ffffff; border: 1px solid rgba(23,25,28,.14)">
      <span style="padding: 12px; border-right: 1px solid rgba(23,25,28,.14); display: grid"><b style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; color: #3b6391">{{s1}}</b><span style="font-size: 12px; color: #5d6470">{{l1}}</span></span>
      <span style="padding: 12px; border-right: 1px solid rgba(23,25,28,.14); display: grid"><b style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; color: #2f6b3a">{{s2}}</b><span style="font-size: 12px; color: #5d6470">{{l2}}</span></span>
      <span style="padding: 12px; display: grid"><b style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; color: #9a4f0f">{{s3}}</b><span style="font-size: 12px; color: #5d6470">{{l3}}</span></span>
    </div>

    <section style="display: grid; gap: 8px">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px">{{checkTitle}} · {{doneCount}} of {{checkCount}}</h2>
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
        <label style="display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 10px 12px; background: #ffffff; border: 1px solid rgba(23,25,28,.14); cursor: pointer">
          <input type="checkbox" checked="{{c.done}}" onChange="{{c.toggle}}" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #3b6391; flex: 0 0 auto">
          <span style="display: grid"><b style="font-weight: 600">{{c.label}}</b><span style="font-size: 13px; color: #5d6470">{{c.sub}}</span></span>
        </label>
      </sc-for>
      <a href="Contributions.dc.html" style="min-height: 44px; display: flex; align-items: center; font-weight: 600">{{cta}}</a>
    </section>

    <section style="display: grid; gap: 8px">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px">Reminders</h2>
      <sc-for list="{{reminders}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; background: #ffffff; border: 1px solid rgba(23,25,28,.14)">
          <span>{{r.label}}</span>
          <button type="button" role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}}" onClick="{{r.toggle}}" style="{{r.track}}"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #ffffff; display: block"></span></button>
        </div>
      </sc-for>
    </section>

    <section style="display: grid; gap: 6px">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px">What the tracker counts here</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
          <span style="padding: 2px 10px; border: 1px solid rgba(23,25,28,.3); font-size: 14px">{{c.n}}</span>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #5d6470">The tracker helps you prepare. The award decision stays with the program.</span>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const done = s.done || { 0: true };
    let key = 'mvp';
    try { key = new URLSearchParams(window.location.search).get('p') || 'mvp'; } catch (e) { key = 'mvp'; }
    const GENERIC = [
      ['Requirements read on the program site', 'What counts and when it is due'],
      ['Matching contributions tagged', 'Tag them in the log with this program'],
      ['Application or renewal date set', 'Reminder 30 days before']
    ];
    const PROGRAMS = {
      mvp: {
        name: 'Microsoft MVP', sub: 'Award areas: [AREA 1], [AREA 2] · Annual review [DATE]',
        s: [['18', 'this cycle'], ['12', 'in the portal'], ['6', 'still to enter']],
        checkTitle: 'Before the review', cta: 'Enter the 6 open contributions →',
        checks: [
          ['Public profile up to date', 'Bio, photo, award areas'],
          ['All contributions entered', '12 of 18 in the portal'],
          ['Reach written into each description', 'The portal form has no reach field'],
          ['Review date checked in the Program Hub', 'Before [DATE]']
        ],
        chips: ['Articles', 'Podcasts', 'Videos and livestreams', 'Talks', 'Open source and samples', 'Online support', 'Product feedback', 'Mentoring']
      },
      mct: {
        name: 'Microsoft Certified Trainer', sub: 'Renews with your certification · [DATE]',
        s: [['[N]', 'teaching hours'], ['[N]', 'trainings'], ['[DATE]', 'renewal']],
        checkTitle: 'Before the renewal', cta: 'See the trainings in the log →',
        checks: GENERIC, chips: ['Trainings', 'Workshops']
      },
      nvp: {
        name: 'Nerdio NVP', sub: 'Goal: apply · Topic: Azure Virtual Desktop',
        s: [['5', 'matching'], ['0', 'submitted'], ['[DATE]', 'next window']],
        checkTitle: 'Before applying', cta: 'See the 5 matching contributions →',
        checks: GENERIC, chips: ['Azure Virtual Desktop', 'Talks', 'Articles', 'Videos']
      },
      sap: {
        name: 'SAP Champion', sub: 'Goal: nomination · Topic: SAP and Microsoft',
        s: [['2', 'matching'], ['0', 'submitted'], ['[DATE]', 'next window']],
        checkTitle: 'Before the nomination', cta: 'See the 2 matching contributions →',
        checks: GENERIC, chips: ['SAP on Microsoft', 'Articles', 'Talks']
      }
    };
    const P = PROGRAMS[key] || PROGRAMS.mvp;
    const C = P.checks;
    const checks = C.map(([label, sub], i) => ({ label, sub, done: !!done[i], toggle: () => this.setState({ done: Object.assign({}, done, { [i]: !done[i] }) }) }));
    const on = s.on || { a: true, b: true };
    const reminders = [['a', 'Monthly: enter new contributions'], ['b', '30 and 7 days before the deadline']].map(([k, label]) => ({
      label, on: !!on[k],
      toggle: () => this.setState({ on: Object.assign({}, on, { [k]: !on[k] }) }),
      track: 'flex: 0 0 auto; width: 52px; height: 32px; padding: 3px; border-radius: 16px; border: 0; cursor: pointer; display: flex; ' + (on[k] ? 'background: #3b6391; justify-content: flex-end;' : 'background: #c9ccd1; justify-content: flex-start;')
    }));
    return {
      checks, reminders, doneCount: checks.filter((c) => c.done).length, checkCount: checks.length,
      name: P.name, sub: P.sub, checkTitle: P.checkTitle, cta: P.cta,
      s1: P.s[0][0], l1: P.s[0][1], s2: P.s[1][0], l2: P.s[1][1], s3: P.s[2][0], l3: P.s[2][1],
      chips: P.chips.map((n) => ({ n }))
    };
  }
}
</script>
</body>
</html>

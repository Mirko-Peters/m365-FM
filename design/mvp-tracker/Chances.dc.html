<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chances – CFPs and requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#f3f3f2}
a{color:#3b6391}a:hover{color:#2c4b70}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3b6391;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f3f3f2; color: #17191c; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">

  <header style="flex: 0 0 auto; padding: 18px 20px 10px; display: grid; gap: 10px">
    <div style="display: grid">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; line-height: 1">Chances</h1>
      <span style="font-size: 14px; color: #5d6470">Matched to your topics: Copilot, Power Platform, AVD</span>
    </div>
    <div role="group" aria-label="Filter" style="display: flex; gap: 0; overflow-x: auto">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
      <article style="display: grid; gap: 6px; padding: 14px 16px; background: #ffffff; border: 1px solid rgba(23,25,28,.14)">
        <span style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
          <span style="{{it.badgeStyle}}">{{it.badge}}</span>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #3b6391">{{it.kind}}</span>
        </span>
        <b style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 21px; line-height: 1.12">{{it.title}}</b>
        <span style="font-size: 14px; color: #5d6470">{{it.sub}}</span>
        <span style="display: flex; gap: 8px; margin-top: 4px">
          <a href="#" style="flex: 1 1 auto; min-height: 44px; display: grid; place-items: center; background: #17191c; color: #ffffff; text-decoration: none; font-weight: 600">{{it.cta}}</a>
          <button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.reminded}}" style="{{it.remStyle}}">{{it.remLabel}}</button>
        </span>
      </article>
    </sc-for>
  </div>

  <nav aria-label="App" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; border-top: 1px solid rgba(23,25,28,.14); background: #ffffff; padding-bottom: 10px">
    <a href="Main.dc.html" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; color: #5d6470; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10l8-6 8 6v9H3z"></path></svg>Home</a>
    <a href="Contributions.dc.html" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; color: #5d6470; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h12M5 11h12M5 17h8"></path></svg>Log</a>
    <a href="Add.dc.html" aria-label="Add contribution" style="justify-self: center; width: 52px; height: 52px; margin-bottom: 6px; border-radius: 50%; background: #3b6391; color: #ffffff; display: grid; place-items: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4v14M4 11h14"></path></svg></a>
    <a href="Impact.dc.html" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; color: #5d6470; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 18V11M9 18V6M14 18v-9M19 18V3"></path></svg>Impact</a>
    <a href="Chances.dc.html" aria-current="page" style="display: grid; justify-items: center; gap: 2px; padding: 8px 0; min-height: 52px; font-size: 12px; font-weight: 600; color: #3b6391; text-decoration: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"></circle><circle cx="11" cy="11" r="3"></circle></svg>Chances</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const f = s.f || 'all';
    const rem = s.rem || { c1: true };
    const L = [
      { id: 'c1', cat: 'cfp', kind: 'Call for papers', badge: 'Closes in 3 days', urgent: true, title: '[Conference name] · Copilot track', sub: 'Hybrid · [CITY] · [DATE]', cta: 'Submit a talk' },
      { id: 'c2', cat: 'guest', kind: 'Podcast guest', badge: 'New', urgent: false, title: 'M365.FM is looking for guests on AVD', sub: 'Recording remote · 40 min', cta: 'Apply as guest' },
      { id: 'c3', cat: 'match', kind: 'Matching request', badge: 'Match 88%', urgent: false, title: 'Publisher seeks expert quote on Copilot governance', sub: 'Via M365.FM matching · reply by [DATE]', cta: 'Answer request' },
      { id: 'c4', cat: 'cfp', kind: 'Call for papers', badge: 'Closes in 12 days', urgent: false, title: 'M365Con 2027 · sessions', sub: 'Online · [DATE]', cta: 'Submit a talk' },
      { id: 'c5', cat: 'cfp', kind: 'Community event', badge: 'Speakers wanted', urgent: false, title: 'Power Platform Meetup Stuttgart', sub: '[VENUE] · [DATE]', cta: 'Offer a talk' }
    ];
    const items = L.filter((i) => f === 'all' || i.cat === f).map((i) => Object.assign({}, i, {
      badgeStyle: 'padding: 1px 8px; font: 600 12px/1.7 Barlow Condensed, sans-serif; letter-spacing: .08em; text-transform: uppercase; ' + (i.urgent ? 'background: #9a4f0f; color: #ffffff;' : 'border: 1px solid #3b6391; color: #3b6391;'),
      reminded: !!rem[i.id],
      remLabel: rem[i.id] ? 'Reminder on' : 'Remind me',
      remStyle: 'flex: 0 0 auto; min-height: 44px; padding: 0 12px; border-radius: 0; cursor: pointer; font-size: 14px; font-weight: 600; ' + (rem[i.id] ? 'background: #e6edf5; color: #3b6391; border: 1px solid #3b6391;' : 'background: #ffffff; color: #17191c; border: 1px solid rgba(23,25,28,.3);'),
      toggle: () => this.setState({ rem: Object.assign({}, rem, { [i.id]: !rem[i.id] }) })
    }));
    const filters = [['all', 'All'], ['cfp', 'CFPs & events'], ['guest', 'Guest'], ['match', 'Matching']].map(([k, label]) => ({
      label, on: f === k,
      pick: () => this.setState({ f: k }),
      style: 'flex: 0 0 auto; min-height: 42px; padding: 0 12px; margin-right: -1px; border: 1px solid #17191c; border-radius: 0; cursor: pointer; font-family: Barlow Condensed, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; ' + (f === k ? 'background: #17191c; color: #ffffff;' : 'background: #ffffff; color: #17191c;')
    }));
    return { items, filters };
  }
}
</script>
</body>
</html>

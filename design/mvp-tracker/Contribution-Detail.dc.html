<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contribution – ready for the portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#f3f3f2}
a{color:#3b6391}a:hover{color:#2c4b70}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3b6391;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f3f3f2; color: #17191c; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">

  <header style="flex: 0 0 auto; display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgba(23,25,28,.14); background: #ffffff">
    <a href="Contributions.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; color: #17191c; text-decoration: none; font-weight: 600"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 3L5 9l6 6"></path></svg>Contributions</a>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #3b6391">Podcast · Auto · M365.FM</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.08">Copilot Studio governance – guest episode</h1>
    </div>

    <div style="display: grid; gap: 0; background: #ffffff; border: 1px solid rgba(23,25,28,.14)">
      <div style="padding: 10px 14px; border-bottom: 1px solid rgba(23,25,28,.14); display: flex; justify-content: space-between; align-items: center">
        <b style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: .04em">Ready for the MVP portal</b>
        <button type="button" onClick="{{copyAll}}" style="min-height: 40px; padding: 0 12px; background: #3b6391; color: #ffffff; border: 0; border-radius: 0; cursor: pointer; font-weight: 600">{{allLabel}}</button>
      </div>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
        <div style="display: flex; gap: 10px; align-items: center; padding: 8px 6px 8px 14px; border-bottom: 1px solid rgba(23,25,28,.08)">
          <span style="display: grid; flex: 1 1 auto; min-width: 0"><span style="font-size: 12px; color: #5d6470">{{f.k}}</span><span style="overflow-wrap: anywhere">{{f.v}}</span></span>
          <button type="button" onClick="{{f.copy}}" aria-label="{{f.aria}}" style="{{f.btnStyle}}">{{f.btn}}</button>
        </div>
      </sc-for>
    </div>

    <a href="#" style="min-height: 44px; display: flex; align-items: center; font-weight: 600">Open the MVP portal →</a>

    <label style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: #ffffff; border: 1px solid rgba(23,25,28,.14); cursor: pointer">
      <input type="checkbox" checked="{{entered}}" onChange="{{toggleEntered}}" style="width: 22px; height: 22px; accent-color: #2f6b3a">
      <span style="display: grid"><b style="font-weight: 600">Entered in the portal</b><span style="font-size: 13px; color: #5d6470">{{enteredText}}</span></span>
    </label>

    <div style="display: grid; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5d6470">Counts for</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{progs}}" as="p" hint-placeholder-count="4">
          <button type="button" onClick="{{p.toggle}}" aria-pressed="{{p.on}}" style="{{p.style}}">{{p.n}}</button>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const copied = s.copied || {};
    const F = [
      ['Title', 'Copilot Studio governance – guest episode'],
      ['Date', '[DATE]'],
      ['Type', 'Podcast'],
      ['Technology area', '[AREA 1]'],
      ['Link', 'https://www.m365.fm/[episode]'],
      ['Reach', '[N] listeners · [N] countries'],
      ['Description', 'Guest on M365.FM about governance for Copilot Studio agents: environments, DLP and sharing rules.']
    ];
    const fields = F.map(([k, v], i) => ({
      k, v, aria: 'Copy ' + k,
      btn: copied[i] || s.all ? 'Copied' : 'Copy',
      btnStyle: 'flex: 0 0 auto; min-width: 72px; min-height: 40px; border-radius: 0; cursor: pointer; font-size: 14px; font-weight: 600; ' + (copied[i] || s.all ? 'background: #2f6b3a; color: #ffffff; border: 1px solid #2f6b3a;' : 'background: #ffffff; color: #17191c; border: 1px solid rgba(23,25,28,.3);'),
      copy: () => this.setState({ copied: Object.assign({}, copied, { [i]: true }) })
    }));
    const on = s.progs || { MVP: true };
    const progs = ['MVP', 'MCT', 'NVP', 'SAP'].map((n) => ({
      n, on: !!on[n],
      toggle: () => this.setState({ progs: Object.assign({}, on, { [n]: !on[n] }) }),
      style: 'min-height: 44px; padding: 0 16px; border-radius: 0; cursor: pointer; font-family: Barlow Condensed, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .08em; ' + (on[n] ? 'background: #3b6391; color: #ffffff; border: 1px solid #3b6391;' : 'background: #ffffff; color: #17191c; border: 1px solid rgba(23,25,28,.3);')
    }));
    return {
      fields, progs,
      allLabel: s.all ? 'All copied' : 'Copy all',
      copyAll: () => this.setState({ all: true }),
      entered: !!s.entered,
      enteredText: s.entered ? 'Done · 5 left to enter' : 'Tick this after you saved it in the portal',
      toggleEntered: () => this.setState({ entered: !s.entered })
    };
  }
}
</script>
</body>
</html>

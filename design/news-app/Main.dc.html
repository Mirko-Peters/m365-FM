<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome – choose topics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#f3f3f2}
a{color:#3b6391}a:hover{color:#2c4b70}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3b6391;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f3f3f2; color: #17191c; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: grid; gap: 10px">
      <span style="font-size: 20px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase">M365<span style="color: #3b6391">.FM</span> News</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 38px; line-height: 1">What do you work on?</h1>
      <p style="margin: 0; color: #5d6470">You only get news, deadlines and episodes for these topics. Change them any time.</p>
    </div>

    <div role="group" aria-label="Topics" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{topics}}" as="t" hint-placeholder-count="10">
        <button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5d6470">I am mainly</span>
      <div role="group" aria-label="Role" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #17191c">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
    </div>

    <label style="display: grid; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5d6470">Language for news and audio</span>
      <select style="height: 46px; box-sizing: border-box; padding: 0 10px; border: 1px solid #17191c; border-radius: 0; background: #ffffff">
        <option>Deutsch</option>
        <option>English</option>
        <option>Español</option>
        <option>Français</option>
        <option>+15 more</option>
      </select>
    </label>
  </div>

  <div style="flex: 0 0 auto; padding: 14px 20px 22px; border-top: 1px solid rgba(23,25,28,.14); background: #ffffff; display: grid; gap: 8px">
    <span style="font-size: 14px; color: #5d6470">{{countText}}</span>
    <a href="Feed.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 50px; background: #3b6391; color: #ffffff; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: .1em; text-transform: uppercase">Start my feed</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const all = ['Copilot', 'Copilot Studio', 'Teams', 'SharePoint', 'Exchange', 'Entra ID', 'Purview', 'Intune', 'Power Platform', 'Fabric', 'Dynamics 365', 'Azure'];
    const sel = s.sel || { 'Copilot': true, 'Teams': true, 'SharePoint': true, 'Purview': true };
    const role = s.role || 'admin';
    const topics = all.map((label) => {
      const on = !!sel[label];
      return {
        label, on,
        toggle: () => this.setState({ sel: Object.assign({}, sel, { [label]: !on }) }),
        style: 'min-height: 44px; padding: 0 14px; border-radius: 0; cursor: pointer; font-size: 15px; font-weight: 600; ' + (on ? 'background: #3b6391; color: #ffffff; border: 1px solid #3b6391;' : 'background: #ffffff; color: #17191c; border: 1px solid rgba(23,25,28,.3);')
      };
    });
    const roles = [['admin', 'Admin'], ['consult', 'Consultant'], ['listen', 'Listener']].map(([k, label]) => ({
      label, on: role === k,
      pick: () => this.setState({ role: k }),
      style: 'min-height: 46px; border: 0; border-radius: 0; cursor: pointer; font-family: Barlow Condensed, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; ' + (role === k ? 'background: #17191c; color: #ffffff;' : 'background: #ffffff; color: #17191c;')
    }));
    const n = all.filter((t) => sel[t]).length;
    return { topics, roles, countText: n + ' topics selected · deadlines first for admins' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3b6391">
<title>M365.FM Contributor</title>
<style>
  :root{color-scheme:light dark;--bg:#f3f3f2;--fg:#1d2126;--ac:#3b6391}
  @media (prefers-color-scheme:dark){:root{--bg:#1d2126;--fg:#eef0f3;--ac:#82a7d4}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
  main{max-width:28em;padding:1.5em;text-align:center}
  a{color:var(--ac)}
</style>
</head>
<body>
<main>
  <h1>M365.FM Contributor</h1>
  <p id="t">Opening the app &hellip;</p>
  <p><a id="l" href="https://www.m365.fm/community/contributor/">https://www.m365.fm/community/contributor/</a></p>
</main>
<script>
  // Lokale Start-Seite der Capacitor-Huelle. Normalerweise laedt die App direkt server.url (capacitor.config.json);
  // diese Seite erscheint nur, wenn die Huelle ohne server.url gestartet wird.
  if (/^de\b/i.test(navigator.language || "")) document.getElementById("t").textContent = "App wird geöffnet …";
  location.replace(document.getElementById("l").href);
</script>
</body>
</html>

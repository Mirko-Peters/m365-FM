name: Artikel und Cover nachziehen (stuendlich, wenige)
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: articles
  cancel-in-progress: false
jobs:
  articles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'm365fm' }}
      CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
      COMMUNITY_API: https://api-dub.m365.fm
      CRON_KEY: ${{ secrets.CRON_KEY }}
      HAIKU_USD_PER_MTOK_IN: ${{ vars.HAIKU_USD_PER_MTOK_IN || '0.10' }}
      HAIKU_USD_PER_MTOK_OUT: ${{ vars.HAIKU_USD_PER_MTOK_OUT || '0.50' }}
      USD_PER_EUR: ${{ vars.USD_PER_EUR || '1.08' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Artikel schreiben (wenige pro Lauf)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SHOW }}
          ARTICLE_LIMIT: "20"
          ARTICLE_WORKERS: "5"
        run: python generate_articles.py
      - name: Cover-Texte entwerfen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SHOW }}
          COVER_LIMIT: "100"
        run: python generate_covers.py
      - name: Speichern (der Push auf data/ loest den Seitenbau aus; kein zusaetzlicher Start von site.yml)
        run: |
          if [ -n "$(git status --porcelain data/articles data/covers data/spend.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/articles data/covers data/spend.json && git commit -m "Artikel/Cover ergänzt (stündlich)"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          else
            echo "Nichts Neues"
          fi

name: Artikel und Cover nachziehen (taeglich, mit Monatsgrenze)
on:
  schedule:
    - cron: "23 23 * * *"   # einmal taeglich 23:23 UTC, vor dem naechtlichen Seitenbau (01:07 UTC); vorher stuendlich (Mirko, 6.11.2026)
  workflow_dispatch:
    inputs:
      limit: { description: "Neue Artikel in diesem Lauf (leer = 20; fuer einen kompletten Nachholdurchlauf z. B. 600)", required: false, default: "" }
      budget: { description: "Monatsgrenze in USD fuer diesen Lauf (leer = Repo-Variable ARTICLE_BUDGET_USD, sonst 25)", required: false, default: "" }
      workers: { description: "Parallele Aufrufe (leer = 5)", required: false, default: "" }
      mode:
        description: "plan = nur Zahlen (ohne API) | en = Sonnet schreibt fehlende englische Artikel | translate = Haiku uebersetzt vorhandene englische Artikel in 14 Sprachen (unabhaengig von der Sonnet-Monatsgrenze) | all = en, dann translate"
        required: false
        default: "en"
        type: choice
        options: [plan, en, translate, all]
      tr_budget: { description: "Monatsgrenze in USD fuer die Haiku-Uebersetzungen (leer = Repo-Variable ARTICLE_TR_BUDGET_USD, sonst 60)", required: false, default: "" }
permissions:
  contents: write
concurrency:
  group: articles
  cancel-in-progress: false
jobs:
  articles:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # Uebersetzungs-Batches (WAIT_MIN 200); Nachholdurchlauf mit vielen Artikeln; der taegliche Lauf braucht wenige Minuten
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'm365fm' }}
      CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
      COMMUNITY_API: https://api-dub.m365.fm
      CRON_KEY: ${{ secrets.CRON_KEY }}
      HAIKU_USD_PER_MTOK_IN: ${{ vars.HAIKU_USD_PER_MTOK_IN || '0.10' }}
      HAIKU_USD_PER_MTOK_OUT: ${{ vars.HAIKU_USD_PER_MTOK_OUT || '0.50' }}
      USD_PER_EUR: ${{ vars.USD_PER_EUR || '1.08' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kostenbuch je Schluessel zusammenfuehren (data/spend.json, auch bei pull --rebase -X theirs; Schluessel anderer Jobs wie "shownotes" bleiben)
        run: |
          cp tools/spend_merge.py "$RUNNER_TEMP/spend_merge.py"; echo 'data/spend.json merge=spendjson' >> .git/info/attributes
          git config merge.spendjson.driver "python3 $RUNNER_TEMP/spend_merge.py %O %A %B"
      - name: Artikel schreiben (en) bzw. uebersetzen (translate/all) bzw. Plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SHOW }}
          ARTICLE_MODE: ${{ inputs.mode || 'en' }}   # taeglicher Lauf (cron): nur Sonnet-Englisch; Uebersetzen per Hand (mode translate/all)
          ARTICLE_TR_BUDGET_USD: ${{ inputs.tr_budget || vars.ARTICLE_TR_BUDGET_USD || '60' }}   # Haiku-Uebersetzungen je Kalendermonat, getrennt von ARTICLE_BUDGET_USD ("articles_tr" in data/spend.json)
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'claude-haiku-5-5' }}
          ARTICLE_LIMIT: ${{ inputs.limit || '20' }}
          ARTICLE_WORKERS: ${{ inputs.workers || '5' }}
          ARTICLE_MODEL: ${{ vars.ARTICLE_MODEL || 'claude-sonnet-5-5' }}   # Mirko, 6.11.2026: Sonnet bleibt; Monatsgrenze haelt die Artikel im November an (erst ab 1.12. wieder)
          ARTICLE_BUDGET_USD: ${{ inputs.budget || vars.ARTICLE_BUDGET_USD || '25' }}   # Sonnet-Kosten je Kalendermonat; ist sie erreicht, schreibt der Lauf nichts mehr
        run: python generate_articles.py
      - name: Cover-Texte entwerfen
        if: ${{ inputs.mode != 'plan' && inputs.mode != 'translate' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SHOW }}
          COVER_LIMIT: "100"
        run: python generate_covers.py
      - name: Speichern (auf die Website kommen Artikel und Cover mit dem naechtlichen Seitenbau, site.yml 01:07 UTC - Bot-Commits loesen keinen Bau aus)
        if: always()   # auch nach Fehler, Zeitlimit oder Abbruch: bezahlte Uebersetzungen, offene Batch-IDs (articles_tr_state.json) und das Kostenbuch gehen nie verloren
        run: |
          git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
          for f in data/articles data/covers data/spend.json data/articles_tr_state.json; do git add -A -- "$f" 2>/dev/null || true; done   # auch geloeschter Zwischenstand
          if ! git diff --cached --quiet; then git commit -q -m "Artikel/Cover ergänzt (täglich)"; fi
          git fetch -q origin main
          N=$(git rev-list --count FETCH_HEAD..HEAD)
          if [ "$N" = "0" ]; then echo "Artikel: nichts Neues zu speichern" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # main bewegt sich oft (Bots): nachziehen und wiederholen; data/spend.json fuehrt der Treiber spendjson je Schluessel zusammen, -X theirs gilt nur fuer die uebrigen Dateien
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q -X theirs origin main; then
              if git push -q origin HEAD:main; then echo "Artikel: $N Commit(s) auf main gespeichert (Artikel, Uebersetzungen, Zwischenstand, Kostenbuch)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i*7))
          done
          echo "Artikel: Push fehlgeschlagen - $N Commit(s) mit bezahlten Ergebnissen liegen NICHT auf main (Artefakt artikel-daten am Lauf)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::Artikel/Uebersetzungen und Kostenbuch konnten nicht gespeichert werden (Push abgelehnt)"; exit 1
      - name: Daten als Artefakt sichern (nur wenn ein Schritt gescheitert ist - bezahlte Ergebnisse gehen nicht mit dem Runner verloren)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: artikel-daten
          path: |
            data/articles
            data/covers
            data/spend.json
            data/articles_tr_state.json
          if-no-files-found: ignore
          retention-days: 30

name: Search-Console-Export (woechentlich, #156)
# tools/gsc_export.py schreibt <bis-datum>.json: Suchanfrage, Seite, Land, Klicks, Impressionen, CTR, Position der letzten 7 Tage bis vor 3 Tagen
# (Format im Kopf des Werkzeugs). Grundlage fuer die SEO-Auswertung neben den Suchbegriffen der Seitensuche (GET /api/search/gaps).
# NICHT IM REPO: Das Repo ist oeffentlich, Suchanfragen aus der Search Console gehoeren nicht hinein (wie team-analytics.yml). Die Datei wird mit
# TEAM_ANALYTICS_KEY verschluesselt und nur als Artefakt "gsc-export" (90 Tage) hochgeladen; entschluesseln wie in team-analytics.yml beschrieben.
# Einrichtung wie ai-stats.yml: Dienstkonto in Google Cloud mit aktivierter "Google Search Console API", JSON-Schluessel als Secret GSC_SERVICE_ACCOUNT_JSON,
# die E-Mail des Dienstkontos in der Search Console als Nutzer (eingeschraenkt) der Property eintragen; Property ueber die Eingabe site, sonst die
# Repo-Variable GSC_SITE, sonst sc-domain:m365.fm. Das Secret wird nie ausgegeben (nur als Umgebungsvariable an das Werkzeug).
# Fehlt das Secret oder antwortet die API mit 403 (Dienstkonto nicht eingetragen), bleibt der Lauf gruen mit einem ::notice:: und es wird nichts geschrieben.
on:
  schedule:
    - cron: "23 5 * * 2"   # dienstags: die Tage bis Samstag sind dann vollstaendig
  workflow_dispatch:
    inputs:
      site:
        description: "Property (sc-domain:m365.fm oder https://www.m365.fm/); leer = Repo-Variable GSC_SITE bzw. sc-domain:m365.fm"
        required: false
        default: ""
      dry_run:
        description: "Nur abrufen und Summen anzeigen, nichts speichern"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gsc-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Signatur fuer das Dienstkonto (JWT RS256)
        run: pip install -q requests cryptography
      - name: Selbsttest (ohne Netz, ohne Secrets)
        run: python -B -m unittest discover -s tests -p test_gsc_export.py
      - name: Search Console abrufen
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ inputs.site || vars.GSC_SITE }}
        run: python tools/gsc_export.py --out-dir gscout ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Verschluesseln (unverschluesselt nie hochladen, nie ins Repo)
        id: enc
        if: ${{ !inputs.dry_run }}
        env:
          TEAM_ANALYTICS_KEY: ${{ secrets.TEAM_ANALYTICS_KEY }}
        run: |
          set -o pipefail
          if [ ! -d gscout ] || [ -z "$(ls -A gscout 2>/dev/null)" ]; then echo "Nichts exportiert"; exit 0; fi
          if [ -z "$TEAM_ANALYTICS_KEY" ]; then rm -rf gscout; echo "::notice::Secret TEAM_ANALYTICS_KEY fehlt - der Export wird nicht aufgehoben (oeffentliches Repo)."; exit 0; fi
          mkdir -p enc
          tar czf - -C gscout . | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -out enc/gsc-export.tar.gz.enc -pass env:TEAM_ANALYTICS_KEY
          rm -rf gscout
          echo "ready=1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.enc.outputs.ready == '1' }}
        with:
          name: gsc-export
          path: enc/gsc-export.tar.gz.enc
          retention-days: 90
          if-no-files-found: error

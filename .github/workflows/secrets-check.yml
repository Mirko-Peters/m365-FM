name: Secrets prüfen (Bing, Press Ranger, YouTube, HeySummit, AI Gateway)
# Prüft nur, ob die Zugänge funktionieren. Gibt keine Schlüssel aus, nur Statuscodes und Zahlen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/secrets-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Bing Webmaster API
        env:
          BING_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          if [ -z "$BING_KEY" ]; then echo "::error::BING_WEBMASTER_API_KEY fehlt"; exit 1; fi
          code=$(curl -sS -o bing.json -w '%{http_code}' "https://ssl.bing.com/webmaster/api.svc/json/GetUserSites?apikey=${BING_KEY}")
          echo "HTTP $code"
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d = json.load(open('bing.json')).get('d') or []
              print(f"### Bing Webmaster API: OK, {len(d)} Websites")
              for s in d:
                  print(f"- {s.get('Url')} (verifiziert: {s.get('IsVerified')})")
          except Exception as e:
              print("### Bing Webmaster API: Antwort nicht lesbar", type(e).__name__)
          EOF
          cat "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || exit 1
      - name: Press Ranger MCP
        if: always()
        env:
          PR_TOKEN: ${{ secrets.PRESSRANGER_MCP_TOKEN }}
        run: |
          if [ -z "$PR_TOKEN" ]; then echo "::error::PRESSRANGER_MCP_TOKEN fehlt"; exit 1; fi
          H=(-H "Authorization: Bearer ${PR_TOKEN}" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream")
          code=$(curl -sS -D h1.txt -o init.txt -w '%{http_code}' "${H[@]}" https://pressranger.com/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"m365fm-secrets-check","version":"1.0"}}}')
          echo "initialize: HTTP $code"
          sid=$(grep -i '^mcp-session-id:' h1.txt | cut -d' ' -f2 | tr -d '\r')
          S=(); [ -n "$sid" ] && S=(-H "Mcp-Session-Id: $sid")
          curl -sS -o /dev/null "${H[@]}" "${S[@]}" https://pressranger.com/mcp -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' || true
          code2=$(curl -sS -o list.txt -w '%{http_code}' "${H[@]}" "${S[@]}" https://pressranger.com/mcp -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          echo "tools/list: HTTP $code2"
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, re
          def parse(p):
              t = open(p).read()
              m = re.findall(r'^data:\s*(\{.*\})\s*$', t, re.M)
              return json.loads(m[-1] if m else t)
          try:
              tools = parse('list.txt').get('result', {}).get('tools', [])
              print(f"### Press Ranger MCP: {'OK' if tools else 'keine Tools'}, {len(tools)} Tools")
          except Exception as e:
              print("### Press Ranger MCP: Antwort nicht lesbar", type(e).__name__)
          EOF
          cat "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] && [ "$code2" = "200" ] || exit 1
      - uses: actions/checkout@v4
        if: always()
      - name: YouTube-Token entschlüsseln
        if: always()
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          pip install -q requests cryptography
          python yt_auth.py env
      - name: YouTube Analytics (Kanal m365 Show)
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import datetime, os, requests, sys
          r = requests.post("https://oauth2.googleapis.com/token", data={"grant_type": "refresh_token", "refresh_token": os.environ["YT_REFRESH_TOKEN"],
              "client_id": os.environ["YT_CLIENT_ID"], "client_secret": os.environ["YT_CLIENT_SECRET"]}, timeout=60)
          if r.status_code != 200:
              print(f"### YouTube: Token-Erneuerung fehlgeschlagen (HTTP {r.status_code})"); sys.exit(1)
          tok = r.json()
          scopes = tok.get("scope", "")
          print(f"### YouTube: Token OK, Analytics-Recht: {'ja' if 'yt-analytics' in scopes else 'NEIN (neu verbinden: https://api-dub.m365.fm/auth/youtube/connect)'}")
          end = datetime.date.today(); start = end - datetime.timedelta(days=28)
          a = requests.get("https://youtubeanalytics.googleapis.com/v2/reports", params={"ids": "channel==MINE", "startDate": str(start), "endDate": str(end),
              "metrics": "views,estimatedMinutesWatched,subscribersGained"}, headers={"authorization": "Bearer " + tok["access_token"]}, timeout=60)
          if a.status_code == 200:
              row = (a.json().get("rows") or [[0, 0, 0]])[0]
              print(f"- Letzte 28 Tage: {row[0]} Aufrufe, {row[1]} Minuten Wiedergabezeit, {row[2]} neue Abos")
          else:
              msg = a.json().get("error", {}).get("message", "")[:200] if a.headers.get("content-type", "").startswith("application/json") else ""
              print(f"- Analytics-Abfrage: HTTP {a.status_code} {msg}"); sys.exit(1)
          EOF
      - name: HeySummit API
        if: always()
        env:
          HS_KEY: ${{ secrets.HEYSUMMIT_API_KEY }}
        run: |
          if [ -z "$HS_KEY" ]; then echo "### HeySummit: HEYSUMMIT_API_KEY fehlt" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          code=000
          for url in https://api.heysummit.com/api/events/ https://api.heysummit.com/api/events https://api.heysummit.com/api/v1/events/ https://app.heysummit.com/api/events/; do
            for auth in "Token" "Bearer"; do
              code=$(curl -sS -L -o hs.json -w '%{http_code}' -H "Authorization: $auth ${HS_KEY}" -H "Accept: application/json" "$url")
              echo "HeySummit $url mit $auth: HTTP $code $(head -c 160 hs.json | tr -d '\n')"
              [ "$code" = "200" ] && break 2
            done
          done
          python3 - "$code" "$auth" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          code, auth = sys.argv[1], sys.argv[2]
          try: d = json.load(open("hs.json"))
          except Exception: d = {}
          items = d.get("results", d if isinstance(d, list) else [])
          if code == "200": print(f"### HeySummit: OK ({auth}), {len(items)} Events" + "".join(f"\n- {e.get('title') or e.get('name')}" for e in items[:10] if isinstance(e, dict)))
          else: print(f"### HeySummit: HTTP {code}")
          PY
          [ "$code" = "200" ]
      - name: Cloudflare AI Gateway
        if: always()
        env:
          AIG: ${{ secrets.CF_AIG_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GW: ${{ vars.AI_GATEWAY_ID }}
        run: |
          [ -n "$GW" ] || { echo "### AI Gateway: Variable AI_GATEWAY_ID fehlt" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$AIG" ] || { echo "### AI Gateway: CF_AIG_TOKEN fehlt" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          code=$(curl -sS -o aig.json -w '%{http_code}' "https://gateway.ai.cloudflare.com/v1/${ACC}/${GW}/workers-ai/@cf/meta/llama-3.1-8b-instruct" \
            -H "cf-aig-authorization: Bearer ${AIG}" -H "Authorization: Bearer ${AIG}" -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Reply with the single word OK."}],"max_tokens":5}')
          python3 - "$code" "$GW" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          code, gw = sys.argv[1], sys.argv[2]
          try: d = json.load(open("aig.json"))
          except Exception: d = {}
          if code == "200": print(f"### AI Gateway '{gw}': OK (Workers AI über das Gateway, Antwort: {str((d.get('result') or {}).get('response', ''))[:20]!r})")
          else: print(f"### AI Gateway '{gw}': HTTP {code} {json.dumps(d.get('errors') or d)[:200]}")
          PY
          [ "$code" = "200" ]

name: Bau-Probe (ohne Veroeffentlichung)
# Baut die Seite auf einem Ticket-Branch vollstaendig, prueft interne Links und die Vor/Zurueck-Leiste. Laedt nichts hoch, veroeffentlicht nichts.
on:
  workflow_dispatch:
  push:
    branches: [ticket/prev-next, ticket/pagination-urls, copilot/docs-groesse-reduzieren]
permissions:
  contents: read
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # generate_site.py braucht inzwischen gut 100 min (site.yml 25.11.2026); mit 60 brach die Probe in den Community-Seiten ab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Cache der Community-Exporte (nur lesen)
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: exports-${{ github.run_id }}
          restore-keys: exports-
      - run: pip install -q requests cryptography
      - run: python generate_site.py
      - name: Feste Aehnliche Folgen (site_related.py) - Umfang
        run: python3 -c "import json,os;f='data/sidebar_related.json';d=json.load(open(f));print('Eintraege:',len(d['items']),'Bytes:',os.path.getsize(f))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vor/Zurueck pruefen
        run: python tools/check_pager.py
      - name: Interne Links pruefen (wie im Seitenbau nicht blockierend, bekannte Altfaelle)
        continue-on-error: true
        run: python check_links.py

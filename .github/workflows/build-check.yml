name: Bau-Probe (ohne Veroeffentlichung)
# Baut die Seite auf einem Ticket-Branch vollstaendig, prueft interne Links und die Vor/Zurueck-Leiste. Laedt nichts hoch, veroeffentlicht nichts.
on:
  workflow_dispatch:
  push:
    branches: [ticket/prev-next]
permissions:
  contents: read
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache der Community-Exporte (nur lesen)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: exports-${{ github.run_id }}
          restore-keys: exports-
      - run: pip install -q requests cryptography
      - run: python generate_site.py
      - name: Vor/Zurueck pruefen
        run: python tools/check_pager.py
      - name: Interne Links pruefen (wie im Seitenbau nicht blockierend, bekannte Altfaelle)
        continue-on-error: true
        run: python check_links.py --all --out reports/broken_links.tsv
      - name: Liste der kaputten Links sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links
          path: reports/broken_links.tsv
          if-no-files-found: ignore
          retention-days: 14

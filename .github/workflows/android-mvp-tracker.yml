name: Android-App MVP-Tracker (Debug-APK, Release-AAB, Store-Grafiken)
# Baut die Capacitor-Huelle der Web-App "M365.FM Contributor" (android/mvp-tracker, applicationId fm.m365.contributor).
# Debug-APK: immer, ohne Zugangsdaten. Release-AAB: nur mit den vier Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (Upload-Schluessel; Mirko setzt sie, siehe android/mvp-tracker/README.md).
# Optional: GOOGLE_SERVICES_JSON_BASE64 (Firebase) aktiviert die native Push-Anbindung. Veroeffentlicht wird nichts, es entstehen nur Artefakte.
on:
  push:
    branches: ["claude/android-**"]
    paths:
      - "android/**"
      - "assets/favicon.svg"
      - ".github/workflows/android-mvp-tracker.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-mvp-tracker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/mvp-tracker
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android/mvp-tracker/package-lock.json
      - name: Java 21 (auf dem Runner vorinstalliert)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Gradle-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/mvp-tracker/package-lock.json', 'android/mvp-tracker/tools/customize_android.py') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: java -version
      - run: npm ci
      - name: Store-Grafiken aus assets/favicon.svg erzeugen
        run: node tools/make-graphics.mjs
      - name: Android-Plattform erzeugen (cap add)
        run: npx cap add android
      - name: Plattform anpassen (Manifest, Teilen, Icons, Signierung, optional Firebase)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" | base64 -d > "$RUNNER_TEMP/google-services.json"
            export GOOGLE_SERVICES_JSON_FILE="$RUNNER_TEMP/google-services.json"
          fi
          python3 tools/customize_android.py
          node tools/make-graphics.mjs android/app/src/main/res
      - name: Capacitor sync
        run: npx cap sync android
      - name: Debug-APK bauen
        working-directory: android/mvp-tracker/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Debug-APK bereitstellen
        run: |
          mkdir -p build/out
          cp android/app/build/outputs/apk/debug/app-debug.apk build/out/mvp-tracker-debug.apk
          ls -l build/out
      - name: Pruefen, ob Release-Secrets vorhanden sind
        id: rel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; echo "Release-Secrets vorhanden: signiertes AAB wird gebaut."
          else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::notice::Release-Secrets fehlen: es wird nur ein unsigniertes Release-AAB zur Pruefung gebaut (nicht als Artefakt)."; fi
      - name: Release-AAB signiert bauen
        if: steps.rel.outputs.signed == 'true'
        working-directory: android/mvp-tracker/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.keystore"
          cp app/build/outputs/bundle/release/app-release.aab ../build/out/mvp-tracker-release.aab
      - name: Release-Build-Probe ohne Schluessel (unsigniert, nicht hochgeladen)
        if: steps.rel.outputs.signed != 'true'
        working-directory: android/mvp-tracker/android
        run: ./gradlew --no-daemon bundleRelease
      - name: Pruefsumme und Eckdaten (ohne Geheimnisse)
        run: |
          cd build/out && sha256sum * | tee ../sha256.txt
          unzip -p mvp-tracker-debug.apk AndroidManifest.xml >/dev/null && echo "APK entpackbar"
      - uses: actions/upload-artifact@v4
        with:
          name: mvp-tracker-debug.apk
          path: android/mvp-tracker/build/out/mvp-tracker-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.rel.outputs.signed == 'true'
        with:
          name: mvp-tracker-release.aab
          path: android/mvp-tracker/build/out/mvp-tracker-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mvp-tracker-store-graphics
          path: android/mvp-tracker/build/store-graphics/*.png
          if-no-files-found: error

name: Live-Pruefung Vor/Zurueck (nur lesen)
on:
  workflow_dispatch:
  push:
    branches: [ticket/live-check]
    paths: [.github/workflows/live-check.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Seiten abrufen
        run: |
          for p in /show/episodes/internal-developer-platforms/ /de/ /community/u/mirko-p/blog/from-gatekeeper-to-watcher-bridging-pre-auth-and-post-auth-security/ /pt/show/episodes/the-billion-vector-problem-hnsw-vs-diskann-in-azure-ai-search/ /pt/microsoft-cloud-adoption-framework-explicado-estrategia-planejamento/ /press/ /entity/mirko-peters/; do
            for n in 1 2; do
              curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -H "Accept: text/html" -D /tmp/h -o /tmp/b "https://www.m365.fm$p"
              echo "=== $p (Abruf $n) $(grep -iE '^(cf-cache-status|age|last-modified|x-r2-miss):' /tmp/h | tr -d '\r' | tr '\n' ' ')"
              python3 -c "
          import re,sys
          h=open('/tmp/b',encoding='utf-8',errors='replace').read()
          m=re.search(r'<nav class=\"pnav\".*?</nav>',h,re.S)
          print('  pnav:', re.sub(r'\s+',' ',re.sub(r'<small>|</small>|<b>|</b>',' ',m.group(0)))[:400] if m else '  pnav: KEINE')
          print('  rel prev/next Links:', len(re.findall(r'rel=\"(prev|next)\"',h)), '| site.css:', (re.search(r'site\.[0-9a-f]+\.css',h) or [''])[0], '| In den Medien:', 'id=\"mentions\"' in h, '| Erwaehnt in:', 'Mentioned in' in h or 'Erwähnt in' in h)
          "
              sleep 3
            done
          done

name: Spreaker-Feed gegen geschriebene Shownotes (T25)
# Nachkontrolle nach apply-shownotes: stehen Text und Links im oeffentlichen RSS (Apple/Spotify)? Bericht reports/spreaker-feed-check.md
# Ausserdem (alle 2 h, kostet keinen eigenen Lauf): neu veroeffentlichte Folgen ohne Episodenseite? Dann Seitenbau site.yml mit mode=fresh
# starten (tools/new_episodes_check.py; hoechstens alle SITE_FRESH_GAP_H Stunden, Standard 6). Sonst baut site.yml nur naechtlich und bei Code-Pushes.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Shownotes nach Spreaker schreiben (T25)"]
    types: [completed]
permissions:
  contents: write
  actions: write   # Seitenbau per workflow_dispatch starten (Commits mit dem Standard-Token loesen keinen Push-Lauf aus)
concurrency: { group: spreaker-feed-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Neue Folgen ohne Episodenseite? (oeffentliche RSS-Feeds)
        id: neweps
        continue-on-error: true   # die Shownotes-Pruefung darf daran nicht haengen; der naechtliche Bau nimmt neue Folgen ohnehin mit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_FRESH_GAP_H: ${{ vars.SITE_FRESH_GAP_H || '6' }}
        run: python tools/new_episodes_check.py
      - name: Seitenbau fuer neue Folgen starten (mode=fresh)
        if: steps.neweps.outputs.dispatch == '1' && vars.SITE_FRESH_OFF != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main -f mode=fresh
      - run: python tools/check_spreaker_feed.py
      - name: Bericht speichern
        run: |
          git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/spreaker-feed-check.md reports/spreaker-feed-check.json
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          git commit -q -m "Spreaker-Feed-Pruefung $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1

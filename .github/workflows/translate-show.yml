name: Show uebersetzen (Haiku, Batch)
on:
  workflow_dispatch:
    inputs:
      langs: { description: "Sprachen, kommagetrennt (leer = alle 19)", required: false, default: "" }
      limit: { description: "Nur die neuesten N Folgen (leer = alle)", required: false, default: "" }
      slugs: { description: "Nur diese Folgen (Slugs, kommagetrennt)", required: false, default: "" }
      stale: { description: "Veraltete Fassungen (englisches Original geaendert) neu uebersetzen - kostenpflichtig, nur von Hand; ohne slugs hoechstens 200 je Lauf", type: boolean, default: false }
      wishes: { description: "Nur die in /redaktion/ vorgemerkten Folgen (Wunschliste 'neu uebersetzen')", type: boolean, default: false }
      force_manual: { description: "Auch Folgen neu uebersetzen, bei denen nur von Hand bearbeitete Felder veraltet sind (Standard: gesperrt)", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: translate-show, cancel-in-progress: false }
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'm365fm' }}
      CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
      COMMUNITY_API: https://api-dub.m365.fm
      CRON_KEY: ${{ secrets.CRON_KEY }}
      HAIKU_USD_PER_MTOK_IN: ${{ vars.HAIKU_USD_PER_MTOK_IN || '0.10' }}
      HAIKU_USD_PER_MTOK_OUT: ${{ vars.HAIKU_USD_PER_MTOK_OUT || '0.50' }}
      USD_PER_EUR: ${{ vars.USD_PER_EUR || '1.08' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Batch absenden, abwarten, Ergebnis speichern
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SHOW }}
          LANGS_IN: ${{ inputs.langs }}
          LIMIT_IN: ${{ inputs.limit }}
          SLUGS_IN: ${{ inputs.slugs }}
          STALE_IN: ${{ inputs.stale }}
          WISHES_IN: ${{ inputs.wishes }}
          FORCE_IN: ${{ inputs.force_manual }}
        run: |
          ARGS=""
          [ -n "$LANGS_IN" ] && ARGS="$ARGS --langs $LANGS_IN"
          [ -n "$LIMIT_IN" ] && ARGS="$ARGS --limit $LIMIT_IN"
          [ -n "$SLUGS_IN" ] && ARGS="$ARGS --slugs $SLUGS_IN"
          [ "$STALE_IN" = "true" ] && ARGS="$ARGS --stale"
          [ "$WISHES_IN" = "true" ] && ARGS="$ARGS --wishes"
          [ "$FORCE_IN" = "true" ] && ARGS="$ARGS --force-manual"
          echo "Aufruf: translate_show.py $ARGS"
          python translate_show.py $ARGS
      - name: Ergebnis committen
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/podpage_i18n)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/podpage_i18n && git commit -m "Show-Uebersetzungen (Haiku, Batch)"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi

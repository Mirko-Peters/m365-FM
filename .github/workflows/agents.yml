name: Community-Agent prüfen und veröffentlichen
on:
  workflow_dispatch:
  pull_request:
    paths: ["agents/**", "worker/src/**", "site_mcp.py", "tests/test_site_mcp.py", ".github/workflows/agents.yml"]
  push:
    branches: [main]
    paths: ["agents/**", "site_mcp.py", "tests/test_site_mcp.py", ".github/workflows/agents.yml"]
concurrency: { group: "agents-${{ github.ref }}", cancel-in-progress: false }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents/package-lock.json
      - run: npm ci
      - name: Deutsche und englische Anleitung prüfen
        working-directory: ${{ github.workspace }}
        run: python3 -m py_compile site_mcp.py tests/test_site_mcp.py && python3 -m unittest discover -s tests -p test_site_mcp.py
      - name: Syntax, Tests und Deploy-Build prüfen
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node --check src/index.js && node --check src/session.js && npm test && npm run build
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: agents
      - name: Deploy
        working-directory: agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy

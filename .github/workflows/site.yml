name: Website bauen und veröffentlichen
# Wann gebaut wird (weniger Actions-Minuten, Ziel: privates Repo mit GitHub Pro):
# - naechtlich einmal voll (01:07 UTC = 02:07 Berlin im Winter, 03:07 im Sommer): alle Daten-Abrufe, Plattform-Sync, Spotify;
#   danach (04:47 UTC) setzt spreaker-links.yml das Website-Feld der neuen Folgen auf die frisch gebauten Seiten.
# - bei Pushes nur, wenn sich Code oder Vorlagen aendern (Liste unten). Daten-Commits (data/**, episodes/**, imports/**, shownotes/**,
#   Uebersetzungen, Artikel, Cover) bauen nicht mehr sofort - sie kommen mit dem naechtlichen Bau (oder per "Run workflow").
#   Ausnahme: data/pillar_quiz.json (neue Fragen des Abschlusstests): der Worker hat die Schluessel nach dem Merge sofort (worker.yml), die Testseite soll
#   die Fragen am selben Tag zeigen (bis dahin blendet worker/src/learnquiz.js pageFilter die neuen Leitfaeden aus). Das gilt nur fuer Merges/Pushes von
#   Menschen: pushed pillar-quiz.yml selbst auf main (Standard-Token), startet kein Workflow - die Seite kommt dann mit dem naechtlichen Bau
#   (innerhalb von HAVE_GRACE = 3 Tagen; schneller: site.yml von Hand starten). Jeder solche Push startet einen vollen Bau (~4 h).
# - neue Folgen: spreaker-feed-check.yml (alle 2 h) startet einen Frische-Bau (mode=fresh), sobald eine neu veroeffentlichte Folge noch
#   keine Seite hat (tools/new_episodes_check.py, hoechstens alle SITE_FRESH_GAP_H Stunden, Standard 6).
# - von Hand: "Run workflow" (mode=full wie naechtlich, mode=fresh ohne Spotify-/Plattform-Abgleich, ~30 min kuerzer).
# Stellschrauben (Repo-Variablen, alle optional): SITE_FRESH_GAP_H (Abstand der Frische-Baus, Standard 6), SITE_FRESH_OFF=1 (keine
# Frische-Baus), SITE_PUSH_BUILD=0 (Code-Pushes bauen nicht sofort), SITE_LINKS_EVERY_DAYS=N (Spotify-/Plattform-Abgleich nur jeden N-ten Tag).
on:
  push:
    branches: [main]
    paths: ["generate_site.py", "site_*.py", "generate_og.py", "generate_service_images.py", "check_*.py", "assets/**", "domain.txt", "shows_seo.json",
            "platform_match.py", "show_notes.py", "sync_platforms.py", "sync_live.py", "sync_show_notes.py", "sync_spreaker.py", "spreaker_auth.py",
            "scrape_spotify.py", "fetch_en_episodes.py", "fetch_en_titles.py", "fetch_reviews.py", "generate_articles.py", "generate_covers.py", "translate_blog.py",
            "tools/build_speakers.py", "tools/generate_directory_intros.py", "tools/sponsor_ssr.mjs", "tools/page_hashes.py", "tools/purge_changed.py",
            "tools/r2_common.py", "tools/r2_pages_upload.py", "tools/r2_og_upload.py", "tools/r2_site_sync.py",
            "tests/sponsor_*", "tests/test_site_links.py", "tests/test_player_facade.py", "tests/player_facade.test.mjs", "tests/test_redirects_extra.py", "sitewrk/test/legacy_cases.json", "data/pillar_quiz.json", ".github/workflows/site.yml"]
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = wie der naechtliche Bau (mit Spotify- und Plattform-Abgleich), fresh = ohne diese beiden (neue Folgen, ~30 min kuerzer)"
        type: choice
        options: [full, fresh]
        default: full
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    # Repo-Variable SITE_PUSH_BUILD=0: Code-Pushes bauen nicht sofort (kostet dann 0 Minuten), sie kommen mit dem naechtlichen/Frische-Bau
    # (vars.X || '1'): eine nicht gesetzte Variable ist null, und null != '0' wertet GitHub als Zahl 0 != 0 = false -> jeder Push-Bau wurde uebersprungen
    if: github.event_name != 'push' || (vars.SITE_PUSH_BUILD || '1') != '0'
    runs-on: ubuntu-latest
    concurrency:
      group: site-build
      cancel-in-progress: false   # der laufende Bau wird fertig und veroeffentlicht; von mehreren wartenden Laeufen behaelt GitHub nur den neuesten.
                                  # Vorher (true) brach jeder Push den laufenden Bau ab: am 1.11. zwischen 07:34 und 08:12 sechs Abbrueche in Folge, nichts veroeffentlicht.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Ontologie pruefen (Zyklen, tote Verweise, Dubletten; Bericht in der Zusammenfassung, nicht blockierend - blockierend ist tests/test_ontology.py im PR)
        continue-on-error: true
        run: python3 tools/ontology_check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sponsor-Rechner gegen die Testvektoren des Prototyps pruefen (T37, blockierend; Node ist auf dem Runner vorhanden)
        run: node --test tests/sponsor_calc.test.mjs
      - name: Player nach Klick (kein iframe im ersten HTML, feste Masse) und Ladezeit-Regeln pruefen (blockierend)
        run: node --test tests/player_facade.test.mjs && python3 -m unittest discover -s tests -p test_player_facade.py
      - name: Anhören-Karten (Zuordnung, Platzierung, Rückfall ohne R2-Grafik, Geräte-Skript) prüfen (blockierend)
        run: pip install -q pillow && node --test tests/listen.test.mjs && python3 -m unittest discover -s tests -p test_listen.py
      - name: Interne Links ohne Umweg - Python-Nachbau der Site-Worker-Weiterleitungen, jede alte Adresse in einem Schritt, Sprachwahl auf / (blockierend)
        run: python3 -m unittest discover -s tests -p test_site_links.py && python3 -m unittest discover -s tests -p test_redirect_hops.py && (cd sitewrk && node --test test/legacy.test.mjs test/lang.test.mjs)
      - name: Zusatz-Weiterleitungen (data/redirects_extra.json) gegen den Datenstand pruefen (nicht blockierend)
        # liest Live-Daten (Folgen, Entitaeten, Beitraege): eine Umbenennung oder ein geloeschtes Ziel darf nicht jeden Bau stoppen
        continue-on-error: true
        run: |
          set -o pipefail
          if ! python3 -m unittest discover -s tests -p test_redirects_extra.py 2>&1 | tee "$RUNNER_TEMP/redirects-extra.log"; then
            { echo "### Zusatz-Weiterleitungen: veraltete Eintraege in data/redirects_extra.json"; echo; echo '```'; grep -E "AssertionError|FAIL:|fehlt" "$RUNNER_TEMP/redirects-extra.log" | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::data/redirects_extra.json enthaelt Ziele, die es nicht mehr gibt (siehe Zusammenfassung)"; exit 1
          fi
      - name: Cache fuer den Browser (fester Schluessel, einmal gefuellt)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Cache fuer Teilen-Bilder (rollierend)
        uses: actions/cache@v6
        with:
          path: .ogcache
          key: ogcache-${{ github.run_id }}
          restore-keys: ogcache-
      - name: Cache fuer die Community-Exporte (letzte erreichbare Fassung je Endpunkt, siehe site_fetch.py)
        uses: actions/cache@v6
        with:
          path: data/cache
          key: exports-${{ github.run_id }}
          restore-keys: exports-
      - name: Spreaker-Daten holen (Top-Liste, veroeffentlichte Folgen)
        continue-on-error: true
        env:
          SPREAKER_TOKEN: ${{ secrets.SPREAKER_TOKEN }}
          SPREAKER_CLIENT_ID: ${{ secrets.SPREAKER_CLIENT_ID }}
          SPREAKER_CLIENT_SECRET: ${{ secrets.SPREAKER_CLIENT_SECRET }}
        run: |
          pip install requests cryptography
          python sync_spreaker.py
          if [ -n "$(git status --porcelain data/top.json data/published.json data/spreaker_auth.enc)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/top.json data/published.json data/spreaker_auth.enc && git commit -m "Spreaker-Daten aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Englische Original-Titel der Videos holen (YouTube oEmbed)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_titles.py
          if [ -n "$(git status --porcelain data/en_titles.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_titles.json && git commit -m "Englische Original-Titel aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Englische Show - Audio und Transkripte (Spreaker-RSS)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_episodes.py
          if [ -n "$(git status --porcelain data/en_episodes.json data/en_transcripts)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_episodes.json data/en_transcripts && git commit -m "Englische Show: Audio/Transkripte aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Bewertungen einsammeln (Apple Podcasts)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_reviews.py
          if [ -n "$(git status --porcelain data/reviews_ext.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/reviews_ext.json && git commit -m "Bewertungen aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Spotify-Folgenlinks einsammeln (ohne API) – nur naechtlich/manuell (mode=full), sonst gilt der gespeicherte Stand
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'fresh')
        timeout-minutes: 12
        continue-on-error: true
        run: |
          N="${{ vars.SITE_LINKS_EVERY_DAYS || '1' }}"   # Repo-Variable: naechtlich nur jeden N-ten Tag (Tag im Jahr), spart je ausgelassenem Tag ~12 min
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$N" -gt 1 ] && [ $((10#$(date -u +%j) % N)) -ne 0 ]; then echo "heute nicht (SITE_LINKS_EVERY_DAYS=$N), gespeicherter Stand gilt"; exit 0; fi
          pip install playwright
          playwright install --with-deps chromium
          python scrape_spotify.py
          if [ -n "$(git status --porcelain data/spotify_links.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            (
              for f in data/spotify_links.json; do [ -e "$f" ] && git add -A "$f"; done
              if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
              git commit -q -m "Spotify-Folgenlinks aktualisiert"
              for i in 1 2 3 4 5; do
                if git pull --rebase --autostash -q -X theirs origin main; then
                  git push -q origin HEAD:main && exit 0
                else
                  git rebase --abort 2>/dev/null || true
                fi
                sleep $((i*5))
              done
              echo "::error::Spotify-Folgenlinks konnten nicht gesichert werden"; exit 1
            )
          fi
      - name: Speaker der Events zusammenfuehren (Personen-Entitaeten, Sessions)
        run: python tools/build_speakers.py
      - name: Show Notes aus Spreaker holen (taeglich, nicht bei jedem Push)
        if: github.event_name != 'push' || hashFiles('data/show_notes/*.json') == ''
        continue-on-error: true
        run: |
          python sync_show_notes.py
          if [ -n "$(git status --porcelain data/show_notes)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/show_notes && git commit -m "Show Notes aus Spreaker aktualisiert" -q
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: M365 Show (Livestreams) von YouTube holen
        timeout-minutes: 8
        continue-on-error: true
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          pip install -q yt-dlp
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          python sync_live.py
          rm -f cookies.txt
          if [ -n "$(git status --porcelain data/live.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/live.json && git commit -m "M365 Show: Streams aktualisiert" -q
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Plattform-Sync-Regressionen (offline)
        run: python3 tools/test_sync_platforms.py
      - name: Folgenlinks zu Apple, Spotify, Deezer, YouTube zuordnen (naechtlich/manuell mit mode=full, sonst gilt der gespeicherte Stand)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'fresh')
        timeout-minutes: 26
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          N="${{ vars.SITE_LINKS_EVERY_DAYS || '1' }}"   # Repo-Variable: naechtlich nur jeden N-ten Tag (Tag im Jahr), spart je ausgelassenem Tag ~20 min
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$N" -gt 1 ] && [ $((10#$(date -u +%j) % N)) -ne 0 ]; then echo "heute nicht (SITE_LINKS_EVERY_DAYS=$N), gespeicherter Stand gilt"; exit 0; fi
          pip install -q yt-dlp ytmusicapi
          timeout 23m python sync_platforms.py || echo "::warning::Plattform-Sync vorzeitig beendet (Zeitlimit oder Fehler); der zuletzt gespeicherte Stand wird gesichert"
          if [ -n "$(git status --porcelain data/episode_links.json data/episode_links_report.json data/platforms.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/episode_links.json data/episode_links_report.json data/platforms.json && git commit -m "Plattform-Folgenlinks aktualisiert" -q
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Verzeichnis-Einleitungen nur aus Fakten erzeugen
        continue-on-error: true   # Einleitungen sind optional; ein Fehler hier darf den Seitenbau nicht aufhalten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SHOW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'm365fm' }}
          COMMUNITY_API: https://api-dub.m365.fm
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: python3 tools/generate_directory_intros.py
      - name: Verzeichnis-Einleitungen-Cache sichern
        continue-on-error: true   # Einleitungen sind optional; ein Fehler hier darf den Seitenbau nicht aufhalten
        run: |
          if [ -z "$(git status --porcelain data/directory_intros.json)" ]; then exit 0; fi
          git config user.name "m365-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/directory_intros.json
          git commit -m "Verzeichnis-Einleitungen aktualisiert"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Verzeichnis-Einleitungen konnten nicht gesichert werden"
          exit 1
      # Feste "Aehnliche Folgen" (site_related.py): actions/checkout holt den Stand des Ereignisses. Ein Bau, der hinter dem naechtlichen Bau in der
      # Warteschlange stand, kennt dessen Bot-Commit von data/sidebar_related.json sonst nicht, rechnet dessen neue Schluessel noch einmal (vielleicht mit
      # einer neueren Folge) und ueberschreibt sie beim Sichern: diese Seiten aenderten sich ein zweites Mal. Darum den neuesten Stand von main holen.
      - name: Feste Aehnliche Folgen - neuesten Stand von main holen
        run: git fetch -q origin main && git checkout origin/main -- data/sidebar_related.json 2>/dev/null || echo "data/sidebar_related.json noch nicht auf main (erster Bau legt sie an)"
      - run: python generate_site.py
        env:
          # Notschalter feste "Aehnliche Folgen" der Seitenleiste (site_related.py): Repo-Variable SIDEBAR_RELATED=0 = keine Folgen-Karte. Leer = an.
          SIDEBAR_RELATED: ${{ vars.SIDEBAR_RELATED }}
          # Kurzlink-Basis fuer Sponsor-Links und Hausanzeigen (https://c.m365.fm). Leer = alte Adresse api-dub.m365.fm/go/<code>.
          # Erst als Repo-Variable GO_BASE eintragen, wenn c.m365.fm/<code> ausgeliefert wird (Worker-Deploy mit Route c.m365.fm).
          GO_BASE: ${{ vars.GO_BASE }}
          # Eigene Adresse des Sponsor-Dashboards (https://partner.m365.fm). Leer = Dashboard-Links bleiben www.m365.fm/sponsor/dashboard/.
          # Erst als Repo-Variable PARTNER_BASE eintragen, wenn partner.m365.fm ausgeliefert wird (Site-Worker-Deploy mit Route partner.m365.fm).
          PARTNER_BASE: ${{ vars.PARTNER_BASE }}
          # Eigene Adressen von Verwaltung (https://admin.m365.fm) und Konto/Profil (https://profile.m365.fm), beide noindex. Leer = Links bleiben auf www.m365.fm.
          # Erst als Repo-Variable ADMIN_BASE / PROFILE_BASE eintragen, wenn die Subdomain ausgeliefert wird (Site-Worker-Deploy mit ADMIN_HOST / PROFILE_HOST).
          ADMIN_BASE: ${{ vars.ADMIN_BASE }}
          PROFILE_BASE: ${{ vars.PROFILE_BASE }}
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
      # Eigener Schritt direkt nach dem Bau (nicht erst mit den Money-Keywords): die neuen Zuordnungen stehen ab dem R2-Upload auf den Sprachseiten und
      # muessen auch dann gesichert sein, wenn danach eine blockierende Pruefung scheitert - sonst rechnet der naechste Bau sie neu ("einmalig" gilt nicht).
      # Ohne -X theirs: hat Mirko die Datei waehrend des Baus von Hand geaendert und gibt es einen Konflikt, bleibt seine Fassung; die neuen Treffer
      # verwirft der Bau dann, der naechste Bau rechnet sie auf seiner Fassung neu. Nur auf main (ein Bau auf einem Zweig schiebt nichts nach main).
      - name: Passende Lernpfad-Videos sichern (data/pillar_videos.json, neue Treffer von site_pillar_videos.update)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain data/pillar_videos.json)" ]; then echo "keine neuen Zuordnungen"; exit 0; fi
          git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/pillar_videos.json
          git commit -q -m "Passende Lernpfad-Videos: neue Zuordnungen aus dem Seitenbau"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main; then
              git push -q origin HEAD:main && exit 0
            else
              if git diff --name-only --diff-filter=U | grep -qx 'data/pillar_videos.json'; then
                git rebase --abort 2>/dev/null || true
                git reset -q --soft HEAD~1 && git restore --staged --worktree data/pillar_videos.json   # eigener Commit weg, Datei wie vor dem Bau
                echo "::warning::data/pillar_videos.json wurde waehrend des Baus geaendert (Konflikt) - die Hand-Fassung bleibt, neue Treffer folgen beim naechsten Bau"; exit 0
              fi
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i*5))
          done
          echo "::error::Passende Lernpfad-Videos konnten nicht gesichert werden"; exit 1

      # Direkt nach dem Bau und immer (auch wenn eine spaetere blockierende Pruefung scheitert): die r2out/-Seiten mit den neuen Eintraegen gehen gleich danach
      # in den Bucket und sind damit live. Muss im Git liegen (nicht nur im Actions-Cache), sonst rechnet ein Bau nach Cache-Verlust alles neu und aendert
      # alle Seiten. Daten-Commits loesen diesen Workflow nicht aus.
      - name: Feste Aehnliche Folgen sichern (data/sidebar_related.json, sofort nach dem Bau)
        if: always() && hashFiles('data/sidebar_related.json') != ''
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain data/sidebar_related.json)" ]; then echo "unveraendert"; exit 0; fi
          if git cat-file -e origin/main:data/sidebar_related.json 2>/dev/null && git diff --quiet origin/main -- data/sidebar_related.json; then echo "unveraendert (wie auf main)"; exit 0; fi
          git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/sidebar_related.json && git commit -q -m "Feste Aehnliche Folgen der Seitenleiste ergaenzt"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q -X theirs origin main; then git push -q origin HEAD:main && exit 0; else git rebase --abort 2>/dev/null || true; fi
            sleep $((i*5))
          done
          echo "::error::data/sidebar_related.json konnte nicht gesichert werden"; exit 1
      # Sitemaps der Sprachen ausser en/de liegen seit 16.11.2026 nur in r2out/ (R2-Bucket), Index und en/de in docs/: geprueft werden alle, und zwar
      # VOR dem Upload - was in den Bucket geht, ist sofort live (der Site-Worker liefert es nach dem 404 von GitHub Pages), auch ohne Deploy
      - name: Sitemaps prüfen (docs/ + r2out/, blockierend, vor dem R2-Upload)
        run: python check_sitemaps.py docs r2out
      # Ebenso vor dem Upload (braucht nur docs/ und r2out/ aus generate_site.py): prueft auch die Sitemaps und Seiten in r2out/. Danach waere eine
      # neue fr/es/...-Sitemap oder Sprachseite schon im Bucket und damit live, auch wenn diese Pruefung den Bau anschliessend stoppt.
      - name: Interne Links ohne Weiterleitung (href, JSON-LD, Sitemaps, Feeds in docs/ + r2out/; blockierend, vor dem R2-Upload)
        run: python check_redirect_links.py docs r2out
      # Pruefsummenliste der R2-Seiten in einem eigenen Cache: wird direkt nach dem Upload gesichert (auch wenn spaeter eine blockierende Pruefung
      # scheitert oder der Lauf abgebrochen wird). Vorher ging sie dann verloren und der naechste Lauf lud dieselben Seiten noch einmal hoch.
      - name: Pruefsummenliste der R2-Seiten (letzter Stand)
        uses: actions/cache/restore@v6
        with:
          path: data/cache/r2_pages.json
          key: r2pages-${{ github.run_id }}
          restore-keys: r2pages-
      # Blockierend (11.11.2026): alle Sprachseiten ausser en/de liegen nur im Bucket. tools/r2_pages_upload.py endet nur dann mit 1, wenn eine Seite,
      # eine Sitemap oder ein aus docs/ umgezogener Datenexport (site_size.EXPORT_RX) dort noch ganz fehlt (sonst 404 nach dem Deploy); einzelne Fehler
      # bei schon vorhandenen Dateien und bei anderen Export-Dateien bleiben Warnungen.
      - name: Seiten in den R2-Bucket laden (Sprachseiten und Sitemaps ausser en/de, Sprachfassungen, Exporte und Register; GitHub Pages bleibt klein, nichts wird geloescht)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q boto3
          R2_KEYS_OUT=r2-keys.json python tools/r2_pages_upload.py r2out
      # Was eben in den Bucket ging, ist sofort live (alte Bau-Kennung passt weiter). Scheitert danach eine blockierende Pruefung (check_schema/-encoding/-titles),
      # laeuft der Deploy-Job mit seinem R2-Purge nie: schon gecachte /__r2f-Eintraege dieser Seiten blieben bis R2_EDGE_TTL (1 Tag) alt. Darum hier gleich leeren.
      - name: R2-Kanten-Cache der eben hochgeladenen Seiten leeren (nicht blockierend; der Deploy-Job leert sie noch einmal)
        if: always() && hashFiles('r2-changed.json') != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BASE: https://www.m365.fm
        run: python3 tools/purge_changed.py --r2-upload r2-changed.json
      - name: Pruefsummenliste der R2-Seiten sichern (immer, sofort nach dem Upload)
        if: always() && hashFiles('data/cache/r2_pages.json') != ''
        uses: actions/cache/save@v6
        with:
          path: data/cache/r2_pages.json
          key: r2pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pruefung - Profilseiten vorhanden?
        run: |
          n=$(ls -d docs/community/u/*/ 2>/dev/null | wc -l)
          echo "Profilseiten: $n"
          if [ ! -f docs/community/u/mirko-p/index.html ]; then echo "::warning::Profilseite mirko-p fehlt (Profil-Export fehlgeschlagen oder Profil nicht oeffentlich), siehe Zeile 'Profil-Export' im Log oben"; fi
      - name: Money-Keywords und Profil-Export sichern
        continue-on-error: true
        # data/sidebar_related.json sichert der eigene Schritt direkt nach generate_site.py (oben).
        run: |
          if [ -n "$(git status --porcelain data/money_keywords.json data/members_export.json data/entity_mod.json data/episode_slugs.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            (
              for f in data/money_keywords.json data/members_export.json data/entity_mod.json data/episode_slugs.json; do [ -e "$f" ] && git add -A "$f"; done
              if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
              git commit -q -m "Money-Keywords, Profil-Export, Entitaets-Aenderungsdaten und Folgen-Slugs aktualisiert"
              for i in 1 2 3 4 5; do
                if git pull --rebase --autostash -q -X theirs origin main; then
                  git push -q origin HEAD:main && exit 0
                else
                  git rebase --abort 2>/dev/null || true
                fi
                sleep $((i*5))
              done
              echo "::error::Money-Keywords, Profil-Export, Entitaets-Aenderungsdaten und Folgen-Slugs konnten nicht gesichert werden"; exit 1
            )
          fi
      - name: Interne Links prüfen
        continue-on-error: true
        run: python check_links.py
      - name: Schema.org (JSON-LD) prüfen (blockierend seit T7, Integrationsbau 1.11. ohne Fehler)
        run: python check_schema.py
      - name: Encoding prüfen (Mojibake blockierend)
        run: python check_encoding.py
      - name: Titel und Beschreibungen prüfen (T7, blockierend)
        run: python check_titles.py
      - name: Teilen-Bilder (Open Graph) erzeugen
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk fonts-noto-extra >/dev/null 2>&1 || true
          pip install playwright
          playwright install chromium
          python generate_og.py
      # Teilen-Bilder liegen nicht mehr in docs/ (GitHub Pages, 1-GB-Limit), sondern im R2-Bucket unter og/ und werden ueber
      # https://img.m365.fm/og/... ausgeliefert (generate_site.py OG_BASE). Ersatzbild fuer jede Seite auch dann, wenn das Zeichnen scheitert;
      # Upload VOR dem Deploy und blockierend (OG_REQUIRED=1): schlaegt er fehl, wird nicht veroeffentlicht, der naechste Lauf laedt nur den Rest.
      # Alte Adressen www.m365.fm/og/... leitet der Site-Worker per 301 auf img.m365.fm weiter. Geloescht werden nur persoenliche Karten
      # (Einladungskarte og/einladung/<kuerzel>.png, Profilkarte og/[<sprache>/]community/u/<kuerzel>.png), die der Bau nicht mehr erzeugt:
      # Konto geloescht oder Profil nicht mehr oeffentlich (#320). Sicherung gegen Massenloeschung; bewusst uebergehen: Repo-Variable OG_PRUNE_FORCE=1.
      # Ist der Profil-Export frisch abgerufen und leer (Merker r2img/profiles-export.json), gehen auch die letzten Karten ohne OG_PRUNE_FORCE.
      - name: Teilen-Bilder - Ersatzbild fuer jede Seite ohne Bild
        run: python generate_og.py --fallback-only
      # Illustrationen der Service-Landingpages (site_landing.py): Pillow, deterministisch, wenige Sekunden. Blockierend, weil die Seiten
      # https://img.m365.fm/services/... verlinken: ohne Bilder kein Upload und kein Deploy (wie bei den Teilen-Bildern).
      - name: Service-Bilder erzeugen (r2img/services/, WebP + PNG)
        run: |
          pip install -q pillow
          python generate_service_images.py r2img
      - name: Teilen- und Service-Bilder in den R2-Bucket laden (img.m365.fm/og/ und /services/; nur main, blockierend; Karten entfernter Profile werden geloescht)
        if: github.ref == 'refs/heads/main'
        env:
          OG_REQUIRED: "1"
          OG_PRUNE_FORCE: ${{ vars.OG_PRUNE_FORCE || '0' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q boto3
          python tools/r2_og_upload.py r2img
      - name: Seiten-Hashes (fuer gezieltes Purge und IndexNow)
        run: python tools/page_hashes.py docs page-hashes.json content-hashes.json r2out
      # R2 als Ursprung: Bau-Kennung fuer den Spiegel im Deploy-Job (tools/r2_site_sync.py). Der Site-Worker liest R2 nur, wenn pages/r2-build.txt
      # im Bucket mit /r2-build.txt auf GitHub Pages uebereinstimmt - also erst, wenn dieser Bau vollstaendig und fehlerfrei gespiegelt ist.
      # Endung "-pfad" (17.11.2026): der Site-Worker cacht R2-Antworten dieses Baus unter einem Schluessel ohne Bau-Kennung (/__r2f<pfad>, sitewrk/index.js
      # PATH_KEY) - unveraenderte Seiten behalten ihren Kanten-Cache ueber den Deploy. Voraussetzung ist der R2-Purge vor der Kennung im Deploy-Job unten;
      # Laeufe eines aelteren Workflows schreiben die Kennung ohne Endung und behalten den alten Schluessel mit Bau-Kennung.
      - name: Bau-Kennung fuer den R2-Spiegel
        run: echo "${{ github.run_id }}.${{ github.run_attempt }}-pfad" > docs/r2-build.txt
      - uses: actions/upload-artifact@v7
        with:
          name: page-hashes
          retention-days: 3
          path: |
            page-hashes.json
            content-hashes.json
            r2-changed.json
            r2-keys.json
      - uses: actions/configure-pages@v6
      # upload-pages-artifact laesst ab v4 Punkt-Dateien weg; docs/.well-known/ (security.txt, Agent- und MCP-Karten, api-catalog)
      # und .nojekyll muessen ins Pages-Artefakt (und damit in den R2-Spiegel), deshalb include-hidden-files.
      - uses: actions/upload-pages-artifact@v5
        with: { path: docs, include-hidden-files: true }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      # Seit 16.11.2026 fehlen in docs/ die Sitemaps der Sprachen ausser en/de und die grossen Datenexporte (Register, og-manifest.json, seo-report.json;
      # nur im R2-Bucket, site_size.r2_only). Ausliefern kann sie nur ein Site-Worker mit SITEMAP_R2 und R2_EXPORT in der neuen Fassung (sitewrk.yml,
      # eigener Workflow, Deploy-Schritt continue-on-error). Laeuft noch eine alte Fassung, antworteten sie nach diesem Deploy unter www.m365.fm mit 404
      # (die Sitemaps fuehrt sitemap.xml auf). Darum erst veroeffentlichen, wenn der Worker auf /sitemap.xml beide Merker setzt: x-m365-sitemaps: r2 (Sitemaps) und
      # x-m365-exports: r2 (Exporte) - eine Worker-Fassung nur mit den Sitemaps reicht nicht (20 Versuche im Abstand von 30 s, gut 10 min, dann
      # Abbruch ohne Deploy; GitHub Pages behaelt den alten Stand mit allen Dateien). Der Community-Worker braucht keine neue Fassung: er holt die
      # Register schon mit siteFetch (nach dem 404 von GitHub Pages direkt aus dem Bucket). Notschalter: Repo-Variable SITEMAP_WORKER_CHECK=0.
      - name: Site-Worker liefert Sitemaps und Datenexporte aus R2? (sonst kein Deploy)
        if: (vars.SITEMAP_WORKER_CHECK || '1') != '0'   # wie SITE_PUSH_BUILD oben: eine nicht gesetzte Variable ist null, null != '0' waere false
        run: |
          for i in $(seq 1 20); do
            H=$(curl -sSfI --max-time 20 -A "m365fm-actions/1.0 (+https://www.m365.fm)" "https://www.m365.fm/sitemap.xml?worker-check=${{ github.run_id }}-$i" | tr -d '\r' || true)
            if printf '%s\n' "$H" | grep -qi '^x-m365-sitemaps: *r2$' && printf '%s\n' "$H" | grep -qi '^x-m365-exports: *r2$'; then echo "Site-Worker mit Sitemaps und Exporten aus R2 ist live"; exit 0; fi
            echo "Versuch $i: Merker x-m365-sitemaps/x-m365-exports fehlt (Site-Worker noch nicht veroeffentlicht?)"; [ "$i" -lt 20 ] && sleep 30
          done
          echo "::error::Der Site-Worker liefert die Sitemaps der Sprachen ausser en/de oder die Datenexporte (Register, og-manifest.json, seo-report.json) noch nicht aus R2 (Merker x-m365-sitemaps bzw. x-m365-exports fehlt auf /sitemap.xml). Erst den Workflow sitewrk.yml erfolgreich veroeffentlichen, dann diesen Lauf wiederholen - sonst antworteten diese Dateien mit 404."
          exit 1
      # deploy-pages wartet hoechstens 10 min (MAX_TIMEOUT = 600000 im Code der Action, auch in v5; ein groesserer timeout wird ignoriert). GitHub Pages
      # haengt bei unserer Groesse ab und zu laenger in "syncing_files"/"updating_pages" (Laeufe 529, 616, 627): dann bis zu zwei weitere Versuche
      # mit demselben Artefakt. Erst wenn auch der dritte scheitert, schlaegt der Job fehl (die folgenden Schritte laufen nur nach einem Erfolg).
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
      - name: Letzter Seiten-Stand (Hashes des vorigen Deploys)
        uses: actions/cache/restore@v6
        with:
          path: .pagehashes
          key: page-hashes-${{ github.run_id }}
          restore-keys: page-hashes-
      - uses: actions/download-artifact@v8
        with: { name: page-hashes, path: .newhashes }
      - name: "Cloudflare-Cache nur fuer geaenderte Adressen leeren, IndexNow nur fuer Aenderungen (Bing, Yandex, Seznam, Naver)"
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          INDEXNOW_KEY: 0348df8af6514d5bae4d9f9a5ba51f57
          BASE: https://www.m365.fm
          OLD_CONTENT: .pagehashes/content-hashes.json
          NEW_CONTENT: .newhashes/content-hashes.json
          R2_KEYS: .newhashes/r2-keys.json
          R2_PENDING: .pagehashes/r2-pending.json   # Adressen fuer den R2-Purge nach dem Spiegel (unten), bleibt bis zum Erfolg im Cache
        run: |
          mkdir -p .pagehashes
          python3 tools/purge_changed.py .pagehashes/page-hashes.json .newhashes/page-hashes.json .newhashes/r2-changed.json
          cp .newhashes/page-hashes.json .pagehashes/page-hashes.json
          cp .newhashes/content-hashes.json .pagehashes/content-hashes.json
      # ausdruecklich sichern (nicht erst am Jobende): auch wenn der R2-Spiegel danach scheitert, bleibt der Stand fuer Purge und IndexNow aktuell
      - name: Seiten-Stand dieses Deploys sichern
        if: always() && hashFiles('.pagehashes/page-hashes.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .pagehashes
          key: page-hashes-${{ github.run_id }}-${{ github.run_attempt }}
      # R2 als Ursprung: die eben veroeffentlichte Website (dasselbe Artefakt wie GitHub Pages) in den Bucket spiegeln - nur hier im Deploy-Job
      # (nur main, Umgebung github-pages), also nie neuer als GitHub Pages und nie von einem anderen Branch. Nichts wird geloescht.
      - name: Veroeffentlichte Website holen (GitHub-Pages-Artefakt)
        uses: actions/download-artifact@v8
        with: { name: github-pages, path: .site }
      - name: Pruefsummenliste des R2-Spiegels (letzter Stand)
        uses: actions/cache/restore@v6
        with:
          path: .r2/r2_docs.json
          key: r2docs-${{ github.run_id }}
          restore-keys: r2docs-
      - name: Website in den R2-Bucket spiegeln (R2 als Ursprung; bei Fehlern bleibt GitHub Pages zustaendig)
        id: r2sync
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MANIFEST: .r2/r2_docs.json
          R2_KEEP_KEYS: .newhashes/r2-keys.json
          R2_CHANGED_OUT: .newhashes/r2-changed-docs.json
        run: |
          mkdir -p .site/docs .r2 && tar -xf .site/artifact.tar -C .site/docs
          pip install -q boto3
          python tools/r2_site_sync.py .site/docs
      - name: Pruefsummenliste des R2-Spiegels sichern
        if: always() && steps.r2sync.outcome != 'skipped' && hashFiles('.r2/r2_docs.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .r2/r2_docs.json
          key: r2docs-${{ github.run_id }}-${{ github.run_attempt }}
      # R2-Kanten-Cache (Bau-Kennung mit Endung "-pfad": Schluessel /__r2f<pfad> ohne Bau-Kennung, sitewrk/index.js) fuer alle Adressen mit geaendertem
      # Purge-Hash (tools/page_hashes.py) dieses und noch offener frueherer Laeufe (R2_PENDING oben) leeren - NACH dem vollstaendigen Spiegel und VOR der
      # Kennung: Danach ist jedes Objekt im Bucket auf dem neuen Stand; was ein Isolat mit einer alten Kennung vorher gecacht hat, ist weg, und was es
      # danach cacht, ist schon neu. Vor der neuen Kennung liefert R2 nichts aus diesem Bau, es gibt also kein Fenster mit altem Stand aus dem Cache.
      - name: R2-Kanten-Cache der geaenderten Adressen leeren (nach dem Spiegel, vor der Bau-Kennung)
        id: r2purge
        if: steps.r2sync.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BASE: https://www.m365.fm
        run: python3 tools/purge_changed.py --r2 .pagehashes/r2-pending.json .newhashes/page-hashes.json
      - name: Offene R2-Adressen sichern (leer nach Erfolg)
        if: always() && steps.r2purge.outcome != 'skipped' && hashFiles('.pagehashes/page-hashes.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .pagehashes
          key: page-hashes-${{ github.run_id }}-${{ github.run_attempt }}-r2
      # Ab jetzt liefert der Site-Worker (R2_PRIMARY=1) diesen Bau aus R2 - vorher, und bei jedem Fehler, aus GitHub Pages.
      # Nur nach geleertem R2-Kanten-Cache: scheitert der Purge (auch der Komplett-Purge als Rueckfall), bleibt die alte Kennung und die Website laeuft
      # ueber GitHub Pages; die Adressen bleiben vorgemerkt, der naechste Deploy leert sie und setzt die Kennung.
      - name: Bau-Kennung im Bucket setzen (R2-Spiegel vollstaendig, R2-Kanten-Cache geleert)
        id: r2mark
        if: steps.r2sync.outcome == 'success' && steps.r2purge.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/r2_site_sync.py --marker .site/docs
      - name: R2-Purge fehlgeschlagen? (Website laeuft weiter ueber GitHub Pages)
        if: steps.r2purge.outcome == 'failure'
        run: |
          echo "::error::R2-Kanten-Cache nicht geleert (Log des Schritts 'R2-Kanten-Cache ... leeren') - Bau-Kennung nicht gesetzt, die Website laeuft ueber GitHub Pages bis zum naechsten Deploy."
          exit 1
      - name: R2-Spiegel fehlgeschlagen? (Website laeuft weiter ueber GitHub Pages)
        if: steps.r2sync.outcome == 'failure'
        run: |
          echo "::error::R2-Spiegel fehlgeschlagen (Log des Schritts 'Website in den R2-Bucket spiegeln'). GitHub Pages ist aktuell und liefert; R2 wird erst wieder genutzt, wenn ein Spiegel fehlerfrei durchlaeuft."
          exit 1

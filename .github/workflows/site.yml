name: Website bauen und veröffentlichen
on:
  push:
    branches: [main]
    paths: ["episodes/**", "data/**", "domain.txt", "sync_platforms.py", "sync_live.py", "site_live.py", "tools/build_speakers.py", "platform_match.py", "show_notes.py", "sync_show_notes.py", "generate_og.py", "site_*.py", "site_taxonomy.py", "check_links.py", "check_schema.py", "assets/**", "generate_articles.py", "scrape_spotify.py", "fetch_en_episodes.py", "fetch_en_titles.py", "fetch_reviews.py", "generate_site.py", "translate_blog.py", "generate_covers.py", "sync_spreaker.py", "spreaker_auth.py", "site_cover.py", "site_design.py", "site_money.py", "site_legal.py", "shows_seo.json", ".github/workflows/site.yml", "check_*.py", "shownotes/site/**", "shownotes/QA.txt", "tests/sponsor_*", "tools/sponsor_ssr.mjs"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: site-build
      cancel-in-progress: false   # der laufende Bau wird fertig und veroeffentlicht; von mehreren wartenden Laeufen behaelt GitHub nur den neuesten.
                                  # Vorher (true) brach jeder Push den laufenden Bau ab: am 1.11. zwischen 07:34 und 08:12 sechs Abbrueche in Folge, nichts veroeffentlicht.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sponsor-Rechner gegen die Testvektoren des Prototyps pruefen (T37, blockierend; Node ist auf dem Runner vorhanden)
        run: node --test tests/sponsor_calc.test.mjs
      - name: Cache fuer den Browser (fester Schluessel, einmal gefuellt)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Cache fuer Teilen-Bilder (rollierend)
        uses: actions/cache@v4
        with:
          path: .ogcache
          key: ogcache-${{ github.run_id }}
          restore-keys: ogcache-
      - name: Cache fuer die Community-Exporte (letzte erreichbare Fassung je Endpunkt, siehe site_fetch.py)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: exports-${{ github.run_id }}
          restore-keys: exports-
      - name: Spreaker-Daten holen (Top-Liste, veroeffentlichte Folgen)
        continue-on-error: true
        env:
          SPREAKER_TOKEN: ${{ secrets.SPREAKER_TOKEN }}
          SPREAKER_CLIENT_ID: ${{ secrets.SPREAKER_CLIENT_ID }}
          SPREAKER_CLIENT_SECRET: ${{ secrets.SPREAKER_CLIENT_SECRET }}
        run: |
          pip install requests cryptography
          python sync_spreaker.py
          if [ -n "$(git status --porcelain data/top.json data/published.json data/spreaker_auth.enc)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/top.json data/published.json data/spreaker_auth.enc && git commit -m "Spreaker-Daten aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Englische Original-Titel der Videos holen (YouTube oEmbed)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_titles.py
          if [ -n "$(git status --porcelain data/en_titles.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_titles.json && git commit -m "Englische Original-Titel aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Englische Show - Audio und Transkripte (Spreaker-RSS)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_episodes.py
          if [ -n "$(git status --porcelain data/en_episodes.json data/en_transcripts)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_episodes.json data/en_transcripts && git commit -m "Englische Show: Audio/Transkripte aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Bewertungen einsammeln (Apple Podcasts)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_reviews.py
          if [ -n "$(git status --porcelain data/reviews_ext.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/reviews_ext.json && git commit -m "Bewertungen aktualisiert"
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Spotify-Folgenlinks einsammeln (ohne API) – nur täglich/manuell, bei Pushes gilt der gespeicherte Stand
        if: github.event_name != 'push'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scrape_spotify.py
          if [ -n "$(git status --porcelain data/spotify_links.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            (
              for f in data/spotify_links.json; do [ -e "$f" ] && git add -A "$f"; done
              if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
              git commit -q -m "Spotify-Folgenlinks aktualisiert"
              for i in 1 2 3 4 5; do
                if git pull --rebase --autostash -q -X theirs origin main; then
                  git push -q origin HEAD:main && exit 0
                else
                  git rebase --abort 2>/dev/null || true
                fi
                sleep $((i*5))
              done
              echo "::error::Spotify-Folgenlinks konnten nicht gesichert werden"; exit 1
            )
          fi
      - name: Speaker der Events zusammenfuehren (Personen-Entitaeten, Sessions)
        run: python tools/build_speakers.py
      - name: Show Notes aus Spreaker holen (taeglich, nicht bei jedem Push)
        if: github.event_name != 'push' || hashFiles('data/show_notes/*.json') == ''
        continue-on-error: true
        run: |
          python sync_show_notes.py
          if [ -n "$(git status --porcelain data/show_notes)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/show_notes && git commit -m "Show Notes aus Spreaker aktualisiert" -q
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: M365 Show (Livestreams) von YouTube holen
        timeout-minutes: 8
        continue-on-error: true
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          pip install -q yt-dlp
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          python sync_live.py
          rm -f cookies.txt
          if [ -n "$(git status --porcelain data/live.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/live.json && git commit -m "M365 Show: Streams aktualisiert" -q
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Folgenlinks zu Apple, Spotify, Deezer, YouTube zuordnen (taeglich/manuell, bei Pushes gilt der gespeicherte Stand)
        if: github.event_name != 'push'
        timeout-minutes: 15
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          pip install -q yt-dlp ytmusicapi
          python sync_platforms.py
          if [ -n "$(git status --porcelain data/episode_links.json data/episode_links_report.json data/platforms.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/episode_links.json data/episode_links_report.json data/platforms.json && git commit -m "Plattform-Folgenlinks aktualisiert" -q
            (git pull --rebase --autostash -q -X theirs || git rebase --abort) && git push -q
          fi
      - run: python generate_site.py
      # Pruefsummenliste der R2-Seiten in einem eigenen Cache: wird direkt nach dem Upload gesichert (auch wenn spaeter eine blockierende Pruefung
      # scheitert oder der Lauf abgebrochen wird). Vorher ging sie dann verloren und der naechste Lauf lud dieselben Seiten noch einmal hoch.
      - name: Pruefsummenliste der R2-Seiten (letzter Stand)
        uses: actions/cache/restore@v4
        with:
          path: data/cache/r2_pages.json
          key: r2pages-${{ github.run_id }}
          restore-keys: r2pages-
      - name: Seiten in den R2-Bucket laden (duenne Sprachfassungen; GitHub Pages bleibt klein, nichts wird geloescht)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q boto3
          R2_KEYS_OUT=r2-keys.json python tools/r2_pages_upload.py r2out
      - name: Pruefsummenliste der R2-Seiten sichern (immer, sofort nach dem Upload)
        if: always() && hashFiles('data/cache/r2_pages.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cache/r2_pages.json
          key: r2pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pruefung - Profilseiten vorhanden?
        run: |
          n=$(ls -d docs/community/u/*/ 2>/dev/null | wc -l)
          echo "Profilseiten: $n"
          if [ ! -f docs/community/u/mirko-p/index.html ]; then echo "::warning::Profilseite mirko-p fehlt (Profil-Export fehlgeschlagen oder Profil nicht oeffentlich), siehe Zeile 'Profil-Export' im Log oben"; fi
      - name: Money-Keywords und Profil-Export sichern
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/money_keywords.json data/members_export.json data/entity_mod.json data/episode_slugs.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            (
              for f in data/money_keywords.json data/members_export.json data/entity_mod.json data/episode_slugs.json; do [ -e "$f" ] && git add -A "$f"; done
              if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
              git commit -q -m "Money-Keywords, Profil-Export, Entitaets-Aenderungsdaten und Folgen-Slugs aktualisiert"
              for i in 1 2 3 4 5; do
                if git pull --rebase --autostash -q -X theirs origin main; then
                  git push -q origin HEAD:main && exit 0
                else
                  git rebase --abort 2>/dev/null || true
                fi
                sleep $((i*5))
              done
              echo "::error::Money-Keywords, Profil-Export, Entitaets-Aenderungsdaten und Folgen-Slugs konnten nicht gesichert werden"; exit 1
            )
          fi
      - name: Interne Links prüfen
        continue-on-error: true
        run: python check_links.py
      - name: Schema.org (JSON-LD) prüfen (blockierend seit T7, Integrationsbau 1.11. ohne Fehler)
        run: python check_schema.py
      - name: Sitemaps prüfen (blockierend)
        run: python check_sitemaps.py
      - name: Encoding prüfen (Mojibake blockierend)
        run: python check_encoding.py
      - name: Titel und Beschreibungen prüfen (T7, blockierend)
        run: python check_titles.py
      - name: Teilen-Bilder (Open Graph) erzeugen
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk fonts-noto-extra >/dev/null 2>&1 || true
          pip install playwright
          playwright install chromium
          python generate_og.py
      - name: Seiten-Hashes (fuer gezieltes Purge und IndexNow)
        run: python tools/page_hashes.py docs page-hashes.json
      # R2 als Ursprung: Bau-Kennung fuer den Spiegel im Deploy-Job (tools/r2_site_sync.py). Der Site-Worker liest R2 nur, wenn pages/r2-build.txt
      # im Bucket mit /r2-build.txt auf GitHub Pages uebereinstimmt - also erst, wenn dieser Bau vollstaendig und fehlerfrei gespiegelt ist.
      - name: Bau-Kennung fuer den R2-Spiegel
        run: echo "${{ github.run_id }}.${{ github.run_attempt }}" > docs/r2-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: page-hashes
          retention-days: 3
          path: |
            page-hashes.json
            r2-changed.json
            r2-keys.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Letzter Seiten-Stand (Hashes des vorigen Deploys)
        uses: actions/cache@v4
        with:
          path: .pagehashes
          key: page-hashes-${{ github.run_id }}
          restore-keys: page-hashes-
      - uses: actions/download-artifact@v4
        with: { name: page-hashes, path: .newhashes }
      - name: "Cloudflare-Cache nur fuer geaenderte Adressen leeren, IndexNow nur fuer Aenderungen (Bing, Yandex, Seznam, Naver)"
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          INDEXNOW_KEY: 0348df8af6514d5bae4d9f9a5ba51f57
          BASE: https://www.m365.fm
        run: |
          mkdir -p .pagehashes
          cp .pagehashes/page-hashes.json .newhashes/page-hashes.prev.json 2>/dev/null || true
          python3 tools/purge_changed.py .pagehashes/page-hashes.json .newhashes/page-hashes.json .newhashes/r2-changed.json
          cp .newhashes/page-hashes.json .pagehashes/page-hashes.json
      # R2 als Ursprung: die eben veroeffentlichte Website (dasselbe Artefakt wie GitHub Pages) in den Bucket spiegeln - nur hier im Deploy-Job
      # (nur main, Umgebung github-pages), also nie neuer als GitHub Pages und nie von einem anderen Branch. Nichts wird geloescht.
      - name: Veroeffentlichte Website holen (GitHub-Pages-Artefakt)
        uses: actions/download-artifact@v4
        with: { name: github-pages, path: .site }
      - name: Pruefsummenliste des R2-Spiegels (letzter Stand)
        uses: actions/cache/restore@v4
        with:
          path: .r2/r2_docs.json
          key: r2docs-${{ github.run_id }}
          restore-keys: r2docs-
      - name: Website in den R2-Bucket spiegeln (R2 als Ursprung; bei Fehlern bleibt GitHub Pages zustaendig)
        id: r2sync
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MANIFEST: .r2/r2_docs.json
          R2_KEEP_KEYS: .newhashes/r2-keys.json
          R2_CHANGED_OUT: .newhashes/r2-changed-docs.json
        run: |
          mkdir -p .site/docs .r2 && tar -xf .site/artifact.tar -C .site/docs
          pip install -q boto3
          python tools/r2_site_sync.py .site/docs
      - name: Pruefsummenliste des R2-Spiegels sichern
        if: always() && steps.r2sync.outcome != 'skipped' && hashFiles('.r2/r2_docs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .r2/r2_docs.json
          key: r2docs-${{ github.run_id }}-${{ github.run_attempt }}
      - name: R2-Kanten-Cache fuer geaenderte Adressen leeren (nach dem Spiegel, vor der Bau-Kennung)
        if: steps.r2sync.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BASE: https://www.m365.fm
          PURGE_R2C_ONLY: "1"
        run: python3 tools/purge_changed.py .newhashes/page-hashes.prev.json .newhashes/page-hashes.json .newhashes/r2-changed-docs.json
      # Erst nach dem Purge: ab jetzt liefert der Site-Worker (R2_PRIMARY=1) diesen Bau aus R2 - vorher, und bei jedem Fehler, aus GitHub Pages
      - name: Bau-Kennung im Bucket setzen (R2-Spiegel vollstaendig)
        if: steps.r2sync.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/r2_site_sync.py --marker .site/docs
      - name: R2-Spiegel fehlgeschlagen? (Website laeuft weiter ueber GitHub Pages)
        if: steps.r2sync.outcome == 'failure'
        run: |
          echo "::error::R2-Spiegel fehlgeschlagen (Log des Schritts 'Website in den R2-Bucket spiegeln'). GitHub Pages ist aktuell und liefert; R2 wird erst wieder genutzt, wenn ein Spiegel fehlerfrei durchlaeuft."
          exit 1

name: Blog uebersetzen (Uebersetzer-Team, 14 Sprachen)
# Gesteuert vom Projektmanager (agents/blog-team/projektmanager.md). Kosten: Claude Haiku im Message Batch, Monatsbudget BLOG_BUDGET_USD (USD je Kalendermonat).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = nur Status/Kosten, pilot = 3 neueste Artikel je Sprache, run = Auftrag ausfuehren, stale = nur geaenderte Absaetze veralteter Fassungen neu uebersetzen (kostenpflichtig, nur von Hand), collect = fertige Batches abholen, sample = Stichprobe fuer Reviews"
        type: choice
        options: [plan, pilot, run, stale, collect, sample]
        default: plan
      langs: { description: "Sprachen, kommagetrennt (leer = alle 14)", required: false, default: "" }
      queue: { description: "Nur die in der Verwaltung (/admin/ -> Uebersetzungen) vorgemerkten Beitraege und Sprachen", type: boolean, required: false, default: false }
      limit: { description: "Artikel je Sprache (leer = alle offenen; Modus stale ohne slugs/wishes: leer = 25)", required: false, default: "" }
      order: { description: "newest oder oldest", required: false, default: "newest" }
      slugs: { description: "Nur diese Artikel (Slugs, kommagetrennt)", required: false, default: "" }
      redo: { description: "Gewaehlte Artikel neu uebersetzen (nach Glossar-Aenderung)", type: boolean, default: false }
      wishes: { description: "Modus stale: nur die in /redaktion/ vorgemerkten Eintraege (Wunschliste 'neu uebersetzen')", type: boolean, default: false }
      force_manual: { description: "Auch von Hand bearbeitete Absaetze neu uebersetzen (Maschinentext darunter; Standard: gesperrt)", type: boolean, default: false }
      budget: { description: "Monatsbudget in USD (leer = Repo-Variable BLOG_BUDGET_USD, sonst 10)", required: false, default: "" }
  schedule:
    - cron: "43 */3 * * *"   # alle 3 h: fertige Batches abholen und neue Artikel der letzten 14 Tage uebersetzen (auch Content-Pakete imports/blog/en); BLOG_AUTO=false = nur abholen. Der Zeitplan uebersetzt nie etwas Vorhandenes neu: stale/redo/force_manual gibt es nur als Eingabe von Hand
permissions:
  contents: write
  actions: write
concurrency: { group: translate-blog, cancel-in-progress: false }
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'm365fm' }}
      CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
      COMMUNITY_API: https://api-dub.m365.fm
      CRON_KEY: ${{ secrets.CRON_KEY }}
      HAIKU_USD_PER_MTOK_IN: ${{ vars.HAIKU_USD_PER_MTOK_IN || '0.10' }}
      HAIKU_USD_PER_MTOK_OUT: ${{ vars.HAIKU_USD_PER_MTOK_OUT || '0.50' }}
      USD_PER_EUR: ${{ vars.USD_PER_EUR || '1.08' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Uebersetzer-Team arbeiten lassen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SHOW }}
          BLOG_BUDGET_USD: ${{ inputs.budget || vars.BLOG_BUDGET_USD || '10' }}
          MODE_IN: ${{ inputs.mode || 'scheduled' }}
          AUTO: ${{ vars.BLOG_AUTO }}
          LANGS_IN: ${{ inputs.langs }}
          LIMIT_IN: ${{ inputs.limit }}
          ORDER_IN: ${{ inputs.order }}
          SLUGS_IN: ${{ inputs.slugs }}
          REDO_IN: ${{ inputs.redo }}
          QUEUE_IN: ${{ inputs.queue }}
          WISHES_IN: ${{ inputs.wishes }}
          FORCE_IN: ${{ inputs.force_manual }}
          STALE_LIMIT: ${{ vars.BLOG_STALE_LIMIT || '25' }}
        run: |
          ARGS=""
          [ "$QUEUE_IN" = "true" ] && ARGS="$ARGS --queue"
          [ -n "$LANGS_IN" ] && ARGS="$ARGS --langs $LANGS_IN"
          [ -n "$ORDER_IN" ] && ARGS="$ARGS --order $ORDER_IN"
          [ -n "$SLUGS_IN" ] && ARGS="$ARGS --slugs $SLUGS_IN"
          [ "$REDO_IN" = "true" ] && ARGS="$ARGS --redo"
          MODE="$MODE_IN"
          [ "$WISHES_IN" = "true" ] && ARGS="$ARGS --wishes"
          [ "$FORCE_IN" = "true" ] && ARGS="$ARGS --force-manual"
          # Neuuebersetzung veralteter Fassungen bleibt begrenzt: ohne Auswahl (slugs, Wunschliste, limit) hoechstens STALE_LIMIT Artikel je Sprache; das Monatsbudget gilt ohnehin
          if [ "$MODE" = "stale" ] && [ -z "$LIMIT_IN" ] && [ -z "$SLUGS_IN" ] && [ "$WISHES_IN" != "true" ]; then LIMIT_IN="$STALE_LIMIT"; fi
          if [ "$MODE" = "scheduled" ]; then
            if [ "$AUTO" != "false" ]; then MODE=auto; export WAIT_MIN=60; else MODE=collect; fi   # Standard auto (neue Content-Pakete taeglich); Budget-Deckel BLOG_BUDGET_USD gilt weiter
          fi
          if [ "$MODE" = "pilot" ]; then MODE=run; ARGS="$ARGS --limit 3"
          elif [ -n "$LIMIT_IN" ]; then ARGS="$ARGS --limit $LIMIT_IN"; fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ "$MODE" != "plan" ] && [ "$MODE" != "sample" ]; then
            echo "Kein API-Schluessel (Secret ANTHROPIC_API_KEY_SHOW) - nur Status."; MODE=plan
          fi
          if [ "$MODE" = "collect" ] && [ ! -s data/blog_i18n/batches.json -o "$(cat data/blog_i18n/batches.json 2>/dev/null)" = "[]" ]; then
            echo "Keine offenen Batches - nur Abgleich der Datensaetze mit geaenderten Originalen und Status (ohne API, ohne Kosten)."   # kein exit: sonst blieben Fassungen geaenderter Originale bei BLOG_AUTO=false ungespeichert
          fi
          echo "Modus: $MODE $ARGS"
          python translate_blog.py $MODE $ARGS
          python -c "import json;s=json.load(open('data/blog_i18n/status.json'));print('## Uebersetzer-Team\n\nDiesen Monat **%s \$** von %s \$ (gesamt %s \$) · offen geschaetzt %s \$\n\n| Sprache | fertig | %% |\n|---|---|---|' % (s.get('spent_month_usd', 0), s['budget_usd'], s['spent_usd'], s['rest_est_usd_all']));[print('| %s | %d/%d | %s |' % (v['name'], v['done'], s['posts'], v['pct'])) for v in s['langs'].values()]" >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis committen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/blog_i18n | grep -v 'data/blog_i18n/status.json')" ]; then   # nur status.json neu (Zeitstempel): kein Commit, sonst baute jeder 3-h-Lauf die Seite neu
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/blog_i18n && git commit -q -m "Blog-Uebersetzungen (Uebersetzer-Team)"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi

name: Blog-Queue freigeben (taeglich, Tagesbloecke)
on:
  schedule:
    - cron: "40 22 * * *"   # 22:40 UTC = 23:40 Berlin: vor Artikel-Lauf (23:23 UTC) und Seitenbau (01:07 UTC); der Block des naechsten Tages geht mit dem Bau live
  workflow_dispatch:
    inputs:
      date: { description: "Stichtag JJJJ-MM-TT (leer = morgen nach Berliner Zeit); alle Ordner bis zu diesem Datum werden freigegeben", required: false, default: "" }
      limit: { description: "Hoechstens so viele Artikel in diesem Lauf (leer = 20)", required: false, default: "" }
permissions:
  contents: write
concurrency:
  group: blog-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tagesblock freigeben
        run: python3 tools/blog_release.py "${{ inputs.date }}" "${{ inputs.limit }}"
      - name: Speichern (auf die Website kommt es mit dem naechtlichen Seitenbau - Bot-Commits loesen keinen Bau aus)
        run: |
          git config user.name "m365fm-bot"; git config user.email "bot@m365.fm"
          git add -A imports/blog imports/blog-queue
          if git diff --cached --quiet; then echo "nichts freizugeben"; exit 0; fi
          git commit -m "Blog-Queue: Tagesblock freigegeben"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q && break; sleep 5; done

name: LinkedIn-Follower in die Mediadaten (manuell)
# tools/linkedin_stats.py zaehlt die Follower der Unternehmensseite M365 Show ueber die Pages Data Portability API (nur lesen) und
# traegt die Summe in data/stats/m365con_linkedin.json ein (page.page_followers). Es werden nur Summen gespeichert, nie Follower-Daten.
# Einrichtung (einmalig, Schritt fuer Schritt in LINKEDIN.md):
#   Secret LINKEDIN_ACCESS_TOKEN  Token eines Seiten-Admins mit Recht r_dma_admin_pages_content (laeuft nach 60 Tagen ab - dann neu erzeugen)
#   Optional zur automatischen Erneuerung: Secrets LINKEDIN_REFRESH_TOKEN, LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET (Refresh-Token 365 Tage)
#   Variable oder Secret LINKEDIN_PAGE_ID  Zahl der Seite (Admin-URL linkedin.com/company/<ZAHL>/admin/)
# Reihenfolge: erst Modus "probe" (prueft nur die Form der Antwort, speichert nichts), dann "fetch" mit dry_run, dann "fetch".
# Bewusst noch ohne Zeitplan: erst nach einem erfolgreichen echten Lauf wird ein monatlicher Lauf ergaenzt.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = nur Form der Antwort pruefen (speichert nichts); fetch = Follower zaehlen"
        type: choice
        options: [probe, fetch]
        default: probe
      dry_run:
        description: "fetch: nur zaehlen und anzeigen, nichts speichern"
        type: boolean
        default: true
      trust_total:
        description: "fetch: paging.total der ersten Antwort als Gesamtzahl uebernehmen (schnell; erst nach probe setzen, wenn total passt)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: linkedin-stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 240   # ~100.000 Follower = ~100 Anfragen zu je 61 s, wenn nicht mit total abgekuerzt wird
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Selbsttest (ohne Netz, ohne Secrets)
        run: python -m unittest tests/test_linkedin_stats.py
      - name: LinkedIn abfragen
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}   # optional: dann holt jeder Lauf einen frischen Access-Token (Client-ID und -Secret noetig)
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_PAGE_ID: ${{ vars.LINKEDIN_PAGE_ID || secrets.LINKEDIN_PAGE_ID }}
          LINKEDIN_TRUST_TOTAL: ${{ inputs.trust_total && '1' || '0' }}
        run: python tools/linkedin_stats.py ${{ inputs.mode }} ${{ inputs.mode == 'fetch' && inputs.dry_run && '--dry-run' || '' }}
      - name: Speichern
        if: ${{ inputs.mode == 'fetch' && !inputs.dry_run }}
        run: |
          git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/stats/m365con_linkedin.json
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -q -m "LinkedIn-Follower aktualisiert (Pages Data Portability API)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main; then
              if git push -q origin HEAD:main; then echo "gepusht"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 5))
          done
          echo "Push fehlgeschlagen"; exit 1

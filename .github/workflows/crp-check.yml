name: CRP-Check (nur lesen)
# Kritische Ladekette auf www.m365.fm wie GTmetrix/Lighthouse: Lighthouse mobil und Desktop (je 3 Laeufe, Median),
# dazu die tatsaechlich ausgelieferten <link>/<script>-Tags (was Cloudflare einfuegt: Web-Analytics-Beacon, E-Mail-Schutz).
# Aendert nichts, braucht keine Secrets.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Pfade, durch Leerzeichen getrennt"
        required: false
        default: "/ /de/ /show/episodes/internal-developer-platforms/ /entity/copilot/"
  push:
    branches: [ticket/crp]
    paths: [.github/workflows/crp-check.yml, tools/crp_live.mjs]
permissions:
  contents: read
jobs:
  crp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Ausgelieferte Tags (HTML roh)
        env:
          PATHS_IN: ${{ github.event.inputs.paths || '/ /de/ /show/episodes/internal-developer-platforms/ /entity/copilot/' }}
        run: |
          mkdir -p out/html
          for p in $PATHS_IN; do
            f="out/html/$(echo "$p" | tr '/' '_').html"
            curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -D "$f.hdr" -o "$f" "https://www.m365.fm$p"
            echo "=== $p  ($(wc -c < "$f") Bytes)"
            grep -iE '^(cf-cache-status|content-encoding|cache-control|server-timing|link):' "$f.hdr" || true
            python3 - "$f" <<'PY'
          import re, sys
          h = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          head, _, body = h.partition("</head>")
          for m in re.finditer(r"<link\b[^>]*>", head):
              t = m.group(0)
              if re.search(r'rel="?(stylesheet|preload|preconnect|dns-prefetch|modulepreload)', t): print("HEAD", t[:220])
          for m in re.finditer(r"<script\b[^>]*>", h):
              t = m.group(0)
              if "src=" in t or "cfasync" in t: print("SCRIPT", ("head " if m.start() < len(head) else "body ") + re.sub(r"(integrity|data-cf-beacon)=(\"[^\"]*\"|'[^']*')", r"\1=…", t)[:260])
          for m in re.finditer(r"<link\b[^>]*rel=\"?stylesheet[^>]*>", body): print("BODY-CSS", m.group(0)[:200])
          for m in re.finditer(r"__cf_email__|/cdn-cgi/l/email-protection", h):
              s = max(0, m.start() - 260); print("EMAIL-SCHUTZ …" + re.sub(r"\s+", " ", re.sub(r"<svg.*?</svg>", "<svg/>", h[s:m.start() + 120], flags=re.S)) + "…")
          PY
          done
      - name: Lighthouse (mobil und Desktop, je 3 Laeufe)
        env:
          PATHS_IN: ${{ github.event.inputs.paths || '/ /de/ /show/episodes/internal-developer-platforms/ /entity/copilot/' }}
        run: |
          mkdir -p out/lh
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          for p in $PATHS_IN; do
            enc=$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$p")
            for form in mobile desktop; do
              extra=""; [ "$form" = desktop ] && extra="--preset=desktop"
              for i in 1 2 3; do
                npx -y lighthouse@12.2.1 "https://www.m365.fm$p" $extra --only-categories=performance --output=json --quiet \
                  --chrome-flags="--headless=new --no-sandbox" --output-path="out/lh/${form}__${enc}__$i.json" || echo "Lauf fehlgeschlagen: $form $p $i"
              done
            done
          done
          node tools/crp_live.mjs out/lh | tee out/crp.md
          cat out/crp.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: crp-check, path: out/, retention-days: 7 }

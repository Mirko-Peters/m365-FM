name: Admin-Konto setzen (einmalig, manuell)
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Nutzer-ID (steht in der Verwaltung unter Nutzer; das Repo ist oeffentlich, deshalb gibt der Lauf keine Nutzerliste und keine Namen aus)"
        required: true
concurrency: { group: admin-setzen, cancel-in-progress: false }
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Admin setzen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WANT: ${{ github.event.inputs.user_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          H = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"}
          A = os.environ["CLOUDFLARE_ACCOUNT_ID"]; B = "https://api.cloudflare.com/client/v4/accounts/" + A
          def call(m, p, d=None):
              r = urllib.request.Request(B + p, method=m, headers=H, data=json.dumps(d).encode() if d is not None else None)
              return json.load(urllib.request.urlopen(r))
          db = [x for x in call("GET", "/d1/database?name=m365-dub")["result"] if x["name"] == "m365-dub"][0]["uuid"]
          q = lambda sql, p=[]: call("POST", f"/d1/database/{db}/query", {"sql": sql, "params": p})["result"][0]["results"]
          # Oeffentliches Repo: Actions-Logs liest jeder. Keine Nutzerliste, keine Namen, keine Kennungen (sub) ausgeben - nur die eingegebene ID.
          want = os.environ.get("WANT", "").strip()
          if not want.isdigit():
              print("::error::Bitte die Nutzer-ID (Zahl) eintragen."); raise SystemExit(1)
          pick = q("SELECT id,provider,sub FROM users WHERE id=? AND banned=0", [int(want)])
          if len(pick) != 1:
              print("::error::Kein aktives Konto mit dieser ID."); raise SystemExit(1)
          val = f'{pick[0]["provider"]}:{pick[0]["sub"]}'
          call("PUT", "/workers/scripts/m365-dub-community/secrets", {"name": "ADMIN_SUBS", "text": val, "type": "secret_text"})
          print("::notice::ADMIN_SUBS gesetzt fuer Nutzer-ID", pick[0]["id"])
          PY
